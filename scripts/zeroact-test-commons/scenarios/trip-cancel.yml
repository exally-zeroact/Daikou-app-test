# ============================================================
# scenarios/trip-cancel.yml
# 業務キャンセル・途中終了 (= 代行開始後すぐの中止)
# ============================================================

name: trip-cancel
title: 業務キャンセル (途中終了)
description: |
  代行開始後すぐに顧客側都合等でキャンセルされるケース。
  Meter.start で running=true → 1-2 step だけ GPS 受信 → Meter.businessEnd 呼出。
  短時間 trip の business_distance_m / fare_yen 整合性確認。
category: edge-case

context:
  trip_type: cancellation
  location_type: urban
  weather: clear
  time_of_day: night
  duration_sec: 30  # 30 秒以内に中止
  expected_distance_m: 0-100  # 移動最小 / なし
  expected_fare_yen: 1300  # base_fare 適用

gps_pattern:
  hz: 1
  accuracy_m: 5
  speed_kmh_range: [0, 10]
  characteristics:
    - 業務開始 → 代行開始 → 1-3 sec 走行 → キャンセル
    - speed_kmh はほぼ 0 or 低速
    - 距離 0 で trip 終了する可能性

expected_events:
  - event: meter_start
    description: state.running=true / state.distance_m=0 / state.fare_yen=base_fare
  - event: gps_first_update
    description: state.last_gps セット (但し distance_m 加算には 2 回目 update 必要)
  - event: business_end_immediate
    timing: 5-30 sec
    description: onBusinessEnd 呼出 → state.running=false / Meter 停止
  - event: report_visible
    description: screenBusinessReport 遷移 (= 既存 flow-standard.spec.js と同じ経路)

expected_distance_paths:
  primary: []  # 距離はほぼ 0
  edge:
    - meter.js L551 tier1-commit (= もし 1-2m 動いたら)
  not_expected:
    - meter.js L1168 gap-fill              # 30 秒以内なので未到達
    - meter.js L1190 offroad-incremental
    - meter.js L661 offroad-retroactive

verification:
  invariants:
    - 距離 0 でも fare_yen = base_fare (= 1300・1000m 以下一律)
    - state.running=false 遷移後 distance_m が更に増えない
    - businessEnd 後の screenBusinessReport 表示
  expected_metrics:
    distance_m_max: 100
    fare_yen: 1300
    trip_duration_sec: "< 60"
    final_app_state: "businessReport"

absolute_rules_tested:
  - "短時間 trip でも calcFare の境界 (1000m 以下) で base_fare 適用"
  - "running=false 遷移後の distance_m 凍結"
  - "業務継続性 (= キャンセル後も次 trip へ即時遷移可能)"
