# ============================================================
# bug-patterns/billing-guard.yml
# 課金ガード漏れ・停車中加算・idle 中加算
# ============================================================

pattern_id: BILL-GUARD-001
title: 課金ガード漏れ (停車中 / idle 中 / running=false 時の誤加算)
category: state-machine

description: |
  「課金 ON 条件」(= state.running===true) を満たさない時に
  distance_m / fare_yen / business_distance_m が誤更新されるバグ。
  rideshare アプリでは driver app の状態遷移漏れで頻発し
  「動かしていないのに料金が増える」事象として旅客 / driver から報告される。

real_world_example:
  - source: Uber "State machine consistency in driver apps" (2017)
    issue: driver app の「accept ride」前に GPS 位置更新で trip 距離が累積
    consequence: 配車前の距離が課金に混入・rider 苦情
    fix: state.tripActive === true ガードを全 distance 加算経路に適用
  - source: Lyft "Phantom rides" 上記 GPS-ACC-001 と関連
    issue: driver が offline でも GPS 走行履歴が累積され「動かしていない trip」が記録
    consequence: 統計汚染・税務報告誤り
    fix: state.online === true のガード強化
  - source: 日本 タクシー業界 (口頭事例)
    issue: 乗務員がメーター押下前から GPS 距離が始まる端末で 1m 課金が出る現象
    consequence: 旅客からの苦情・装置交換

how_it_manifests:
  symptoms:
    - 業務開始前 (空車・代行未受託) なのに business_distance_m が増える
    - メーター起動前なのに distance_m / fare_yen が初期値以外
    - 業務終了後に画面表示が止まっていない (= 加算継続)
    - タスクキル復帰後に過剰加算
  log_indicators:
    - state.running===false 時に distance_m += 系のログが出力
    - state.business_distance_m が GPS jitter (= 数 cm) で累積

daikome_risk:
  severity: 高 (= 旅客 / 運転手双方からの苦情リスク)
  absolute_rule_referenced: "distance_m 不可侵 (5加算経路) + 全加算タクシー方式 + 道路ジオメトリ必須・GPS 直線禁止"
  # ★verified 2026-05-28 (drift-static C1 で ±10 line tolerance で動的監視中)
  affected_paths:
    - meter.js L551   Tier1 commit (state.running ガード適用済)
    - meter.js L661   retroactive (running ガード・★絶対ルール適用外区間 sanitizer 通過)
    - meter.js L1168  gap fill (running ガード適用済・Phase2-a 道路 routing 拡張)
    - meter.js L1190  Off-Road incremental (running ガード・★適用外区間 sanitizer 通過)
    - meter.js L1691  setDistance (外部 API・タスクキル復元用)
  existing_protections:
    - distance_m 5 加算経路全てに `if (state.running)` ガード適用済
    - ★business_distance_m は business_active gate★ (= 2026-05-24 ★設計変更宣言・running gate から移行★)
      ・空車中も業務単位累積が伸びる設計 (= 2026-05-17 旧 running gate で「空車中累積停止」 を訂正)
      ・道路 snap 5 経路全てで `if (state.business_active)` 並記 (meter.js L556 等)
    - update() 入口で gpsResult.isStationary 早期 return (= _trackHaversineBetweenGps L351)
    - Worker B 出力強制 0 化 (map-matcher.js: msg.isStationary=true で mmIncrementM=0)
    - ★Fix① 2026-05-28: 静止判定を加速度 variance 主体に作り直し (gps-worker.js L800-834)
      旧 3点AND (= GPS速度<3 必須) で A3 偽速度 3.1km/h により creep していた問題を構造的に解消
    - ★Fix② 2026-05-28: accuracy cap 移動時緩和 (max 20m)・静止時厳格・isStationary と coupled
  unprotected_scenarios:
    - 短時間 running=true ↔ false トグルでの race (= state 観測順序問題)
    - setDistance API 経由の外部書込 (= タスクキル復元用・但し意図的)
    - ★Fix① の高速ガード 10km/h 超の A3 偽速度 spike (= 屋内 σ>0.8m drift) → 想定外の創発で creep の余地★

detection_method:
  static_analysis:
    - 静的解析で `state.distance_m\s*[+]?=` の前後 5 行に `state.running` チェック存在を確認
    - 既存 test: tests/drift-static/distance-m-update-paths-anchor.test.js (= ★Phase 6-7 2026-05-21 で property から移動済★・C1 5 経路 / C3 4 GPS.calcDistance verify)
  property_test:
    - tests/property/isstationary-no-increase.test.js (B1/B2: 任意 distance_m + isStationary で不変)
  e2e_test:
    - tests/e2e/stationary-no-increase.spec.js (= 停車中 distance_m=500 維持・isStationary 注入型)
    - ★tests/e2e/stationary-real-pipeline.spec.js (= 2026-05-28 新規・setGeolocation で実 GPS層を駆動・注入なし)
    - tests/e2e/trip-cancel シナリオ (= scenarios/trip-cancel.yml)
  worker_decision_test:
    - ★tests/integration/stationary-baseline-watchdog.test.js (= 2026-05-28 ★新構造対応 全面書換★・
      実 gps-worker.js 経由・A3偽速度/iOS拒否/屋内 poor acc/Android 5Hz の 9 シナリオ・Fix①②検証)
    - ★tests/replay-mm-worker/pipeline-gate.test.js (= 2026-05-28 新規・useGpsWorker:true で実 worker
      経由・creep/freeze/runaway 閾値 FAIL ゲート)

test_scenario_ref:
  - scenarios/trip-cancel.yml      (= 短時間 trip 整合性)
  - scenarios/traffic-jam.yml      (= 停車発進繰返・isStationary 防御)
  - scenarios/multi-trip.yml       (= 空車区間 business_distance_m 加算なし確認)

prevention:
  - 全 distance 加算経路に `if (state.running)` ガード必須
  - business_distance_m も同等保護
  - isStationary=true の 2 経路防御 (main + Worker B) 維持
  - GPS jitter (= 数 cm) を加算しない `accuracy <= 閾値` ゲート
  - state machine 遷移を property test で網羅
