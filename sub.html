<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>ダイコメ サブ画面</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        overflow: hidden;
      }
      body {
        font-family: 'Noto Sans JP', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .screen {
        display: none;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
      }
      .screen.active {
        display: flex;
      }

      /* 空車 */
      .idle-text {
        font-size: clamp(48px, 12vw, 96px);
        font-weight: 900;
        color: #007aff;
        letter-spacing: 0.2em;
      }

      /* 代行中 */
      .driving-text {
        font-size: clamp(48px, 12vw, 96px);
        font-weight: 900;
        color: #ff3b30;
        letter-spacing: 0.2em;
      }

      /* 料金 */
      .fare-label {
        font-size: clamp(14px, 3vw, 24px);
        color: #555;
        letter-spacing: 3px;
      }
      .fare-amount {
        font-size: clamp(72px, 20vw, 160px);
        font-weight: 900;
        color: #fff;
        line-height: 1;
      }
      .fare-thanks {
        font-size: clamp(12px, 2.5vw, 20px);
        color: #444;
        margin-top: 8px;
      }

      /* 通信確認 */
      .offline-msg {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #ff3b30;
        color: #fff;
        border-radius: 8px;
        padding: 8px 20px;
        font-size: 14px;
        font-weight: 700;
        display: none;
      }
      .offline-msg.show {
        display: block;
      }

      /* 車両選択 */
      .vehicle-sel {
        position: fixed;
        top: 12px;
        left: 12px;
        background: #1a1a1a;
        color: #555;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 13px;
        font-family: 'Noto Sans JP', sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- 空車 -->
    <div class="screen" id="screenIdle">
      <div class="idle-text">空　車</div>
    </div>

    <!-- 代行中 -->
    <div class="screen" id="screenDriving">
      <div class="driving-text">代行中</div>
    </div>

    <!-- 料金 -->
    <div class="screen" id="screenFare">
      <div class="fare-label">ご利用料金</div>
      <div class="fare-amount">¥<span id="fareAmount">0</span></div>
      <div class="fare-thanks">ありがとうございました</div>
    </div>

    <!-- 通信確認 -->
    <div class="offline-msg" id="offlineMsg">通信確認中...</div>

    <!-- 車両選択 -->
    <select class="vehicle-sel" id="vehicleSel">
      <option value="v1">1号車</option>
      <option value="v2">2号車</option>
      <option value="v3">3号車</option>
      <option value="v4">4号車</option>
    </select>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase.js"></script>
    <script>
      let lastUpdate = 0;
      let offlineTimer = null;

      function showScreen(name) {
        ['Idle', 'Driving', 'Fare'].forEach((n) => {
          document
            .getElementById('screen' + n)
            .classList.toggle('active', n.toLowerCase() === name);
        });
      }

      function watchVehicle(vid) {
        FB.watchVehicle(vid, (data) => {
          if (!data) {
            showScreen('idle');
            return;
          }
          lastUpdate = Date.now();
          document.getElementById('offlineMsg').classList.remove('show');

          const status = data.status || 'idle';
          const session = data.session || {};

          if (status === 'idle') {
            showScreen('idle');
          } else if (status === 'driving') {
            showScreen('driving');
          } else if (status === 'finished') {
            showScreen('fare');
            document.getElementById('fareAmount').textContent = (
              session.fare_yen || 0
            ).toLocaleString();
          }
        });
      }

      // 5秒以上更新なし → 通信確認中表示
      setInterval(() => {
        if (lastUpdate > 0 && Date.now() - lastUpdate > 5000) {
          document.getElementById('offlineMsg').classList.add('show');
        }
      }, 1000);

      // 車両切替
      document.getElementById('vehicleSel').addEventListener('change', function () {
        watchVehicle(this.value);
      });

      // URLパラメータで車両指定
      const v = new URLSearchParams(location.search).get('v');
      if (v) {
        document.getElementById('vehicleSel').value = v;
        watchVehicle(v);
      } else {
        watchVehicle('v1');
      }

      showScreen('idle');
    </script>
  </body>
</html>
