name: OSM Roads Auto Update

# ===============================================================
# ダイコメ Map Matching用 道路データ自動生成 v4
# 毎週日曜 03:00 JST に Geofabrik から最新OSM取得
# → 都道府県別に分割して roads-<prefecture>.js を生成
# ===============================================================

on:
  schedule:
    - cron: '0 18 * * 6'
  workflow_dispatch:
    inputs:
      region:
        description: '対象地方（テスト用に1地方ずつ実行可能）'
        required: true
        default: 'shikoku'
        type: choice
        options:
          - shikoku
          - hokkaido
          - tohoku
          - kanto
          - chubu
          - kansai
          - chugoku
          - kyushu
          - all

concurrency:
  group: osm-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-roads:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      matrix:
        region:
          - ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.region || 'all' }}

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v5

      - name: osmium-toolインストール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool

      - name: Node.jsセットアップ
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 処理対象地方リスト決定
        id: regions
        run: |
          INPUT="${{ matrix.region }}"
          if [ "$INPUT" = "all" ]; then
            echo "list=hokkaido tohoku kanto chubu kansai chugoku shikoku kyushu" >> $GITHUB_OUTPUT
          else
            echo "list=$INPUT" >> $GITHUB_OUTPUT
          fi
          echo "対象: $INPUT"

      - name: OSMデータDL & 道路抽出 & 都道府県別JS化
        env:
          REGIONS: ${{ steps.regions.outputs.list }}
        run: |
          set -e
          mkdir -p tmp data

          for REGION in $REGIONS; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "▶ ${REGION} 処理開始"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            URL="https://download.geofabrik.de/asia/japan/${REGION}-latest.osm.pbf"
            PBF="tmp/${REGION}.osm.pbf"
            FILTERED="tmp/${REGION}-roads.osm.pbf"
            GEOJSON="tmp/${REGION}-roads.geojson"

            # 1. ダウンロード
            echo "  [1/4] DL: $URL"
            curl -fsSL --max-time 600 -o "$PBF" "$URL"
            ls -lh "$PBF"

            # 2. 道路抽出
            echo "  [2/4] 道路抽出"
            osmium tags-filter "$PBF" w/highway=motorway,trunk,primary,secondary,tertiary,unclassified,residential,motorway_link,trunk_link,primary_link,secondary_link,tertiary_link \
              -o "$FILTERED" --overwrite

            # 3. GeoJSON変換
            echo "  [3/4] GeoJSON変換"
            osmium export "$FILTERED" -o "$GEOJSON" --overwrite -f geojson

            # 4. 都道府県別JS化（v4: 1地方→複数県のファイル出力）
            echo "  [4/4] 都道府県別JS化"
            node scripts/build-roads.js "$GEOJSON" "data/" "$REGION"

            # 旧形式（地方単位のroads-<region>.js）を削除
            # 2026/05/04 バグ修正：hokkaido は「地方名 = 県名」のため、
            # この削除コマンドが build-roads.js で生成直後の正しい
            # roads-hokkaido.js まで消してしまうバグがあった。
            # hokkaido のみ削除をスキップし、新形式の県ファイルを保護する。
            if [ "$REGION" = "hokkaido" ]; then
              echo "  ℹ️ hokkaido は地方名=県名のため旧形式削除スキップ"
            else
              rm -f "data/roads-${REGION}.js"
            fi

            echo "  生成された県ファイル:"
            ls -lh data/roads-*.js 2>/dev/null | head -20 || true

            # 一時ファイルクリーン
            rm -f "$PBF" "$FILTERED" "$GEOJSON"
            echo "✅ ${REGION} 完了"
          done

      - name: 全地方のmeta統合
        run: |
          # 各地方のmeta-*.jsonを meta.json に統合
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dir = 'data';
          const merged = { generated: new Date().toISOString(), regions: {}, prefectures: {} };
          for (const f of fs.readdirSync(dir)) {
            if (f.startsWith('meta-') && f.endsWith('.json') && f !== 'meta.json') {
              const m = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
              merged.regions[m.region] = m.generated;
              Object.assign(merged.prefectures, m.prefectures);
            }
          }
          fs.writeFileSync(path.join(dir, 'meta.json'), JSON.stringify(merged, null, 2));
          console.log('✅ meta.json 統合完了');
          console.log('  地方数:', Object.keys(merged.regions).length);
          console.log('  県数:', Object.keys(merged.prefectures).length);
          "

      - name: 変更検出
        id: diff
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ 変更あり"
            git status --short data/ | head -20
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 変更なし（コミットスキップ）"
          fi

      - name: 自動コミット & プッシュ
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(roads): OSM自動更新 $(date -u +'%Y-%m-%d') v4都道府県別 [skip ci]"
          git push

      - name: 失敗時のサマリ
        if: failure()
        run: |
          echo "::error::OSM更新失敗。前週のdata/roads-*.jsは残っているのでアプリ継続。"
