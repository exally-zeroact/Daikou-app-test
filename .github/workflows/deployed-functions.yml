name: 配ってある関数とrepoが同じか（週1）

# ★push も CI緑も「客に届いた」ではない★
#   2026-08-09 にテスト線へ入れた直し（請求書の行き先 出発〜経由〜到着）が
#   ★本番の倉庫へ10日 配られていなかった★＝本番の明細が「1地点だけ」で入り続けた。
#   同じ事を三度 起こさないために、★配ってある物を読んで repo と突き合わせる★見張りを週1で回す。
#
# 鍵が無い時は ★赤にする★（SKIP を緑と呼ばない）。
on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 09:00(JST)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 配ってある関数と repo を突き合わせる
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-deployed-functions.mjs
