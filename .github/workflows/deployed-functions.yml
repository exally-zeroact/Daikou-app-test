name: 配ってある関数とrepoが同じか（週1）

# ★push も CI緑も「客に届いた」ではない★
#   2026-08-09 にテスト線へ入れた直し（請求書の行き先 出発〜経由〜到着）が
#   ★本番の倉庫へ10日 配られていなかった★＝本番の明細が「1地点だけ」で入り続けた。
#   同じ事を三度 起こさないために、★配ってある物を読んで repo と突き合わせる★見張りを週1で回す。
#
# 鍵が無い時は ★赤にする★（SKIP を緑と呼ばない）。
on:
  # ★定時をやめた（2026-08-22）★
  #   この確認には Supabase の Management API の鍵が要る。手元に在るのは
  #   ★アカウント全体を触れる強い鍵(PAT)★ で、この repo は ★public★ なので secret に入れられない。
  #   鍵が無いまま定時で回すと ★毎週 必ず赤★になり、
  #   ★赤が当たり前になって 本物の赤に気づけなくなる★（2026-08-22 実際に回して赤で判明）。
  #   ⇒ ★鍵の在る場所（このPC）で1日1回 回す★ … ~/.claude/hooks/check-daikome-functions.js
  #      （fetch して origin/main の中身だけを取り出して数える＝手元が古くても嘘をつかない）
  #   GitHub 側は ★手で押した時だけ★ 残す。プロジェクト限定の鍵を作れたら 定時を戻してよい。
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 配ってある関数と repo を突き合わせる
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-deployed-functions.mjs
