# ダイコメ 認定ゲート CI
#
# ★2026-08-02 作り直し★ — それまで ★直近20回すべて cancelled（一度も完走していない）★ だった。
#   注記: "The job has exceeded the maximum execution time of 20m0s"
#   ＝距離＝課金の根幹を守るゲートが、20回のpushで一度も動いていなかった。
#
#   実測した内訳（1ジョブの中の各ステップ開始時刻）:
#     checkout 4分11秒 / gate-snap 1分54秒 / sim-cert 6分19秒 / obd-engine 1分52秒 /
#     quant 3分42秒 / doppler 実行中のまま → 20分で打ち切り
#     （gate-spread / cert-3env / tunnel / bg-freeze / gnss-degraded は★走ってすらいなかった★）
#
#   直した3点（この順でないと効かない）:
#     1. ★sparse-checkout★ … repo 3,308MB のうち ★data/ が 3,293.8MB（99.6%）★。
#        ゲートが実際に読む data は ★data/roads-ehime.js の 4.4MB だけ★（実測）。
#        road-graph-*(1,138MB) と road-graph-tiles/(1,089MB) は ★どのゲートも読んでいない★
#        （tests/*.js に road-graph の参照ゼロ・grep で確認）。
#        ★分割の前提★: 先に checkout を軽くしないと、ジョブ本数ぶん4分が掛かる。
#     2. ゲートごとにジョブを分けて並列（各ジョブが制限内に収まる）
#     3. timeout-minutes は 1・2 の後に実測から決める（★単独では上げない＝重いまま隠すことになる★）
#
#   ★再発防止★ 20回すり抜けた本当の理由は「遅い」ことではなく、
#   `cancelled` が緑でも赤でもなく、「緑を確認してから進む」の網に引っかからなかったこと。
#   → 最後の cert-gate-result ジョブで ★success 以外（cancelled / timed_out 含む）を赤★ にする。
#
# 中身（何を守っているか）:
#   gate-snap   = 実機3台 fixture を実エンジン(Worker B)に流し snap 配線健全 (committed=0 で FAIL)
#   sim-cert    = 実 pipeline GPS-feed Monte-Carlo。never-over/coast配線/単調/latch を hard-fail。
#                 ±band は dense-proxy 比較のため情報表示のみ (hard-fail しない)。
#                 実過大の hard-gate は truedist-kp / cert-3env (実RTK真値)。
# distance_m / calcFare は read-only 観測のみ・不変。
name: cert-gate

# paths: 距離/エンジン/テストに関わる変更時のみ実行。
#   auto-version ボットの sw.js CACHE_NAME-only commit 等では重い sim を回さない (= 計算節約)。
on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - 'data/roads-*.js'
      - 'package.json'
      - '.github/workflows/cert-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - 'data/roads-*.js'
      - 'package.json'
      - '.github/workflows/cert-gate.yml'

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false # ★1本落ちても他を最後まで走らせる（どこまで壊れているかを1回で知る）★
      matrix:
        include:
          # ── hard-fail（落ちたら赤）──
          - name: snap-accuracy
            cmd: npm run test:gate-snap
            timeout: 10
          # ★2026-08-27 追加：package.json に在るのに どの workflow にも入っていなかった2本★
          #   （check-hosts と同じ「在るのに0回」。creep は 2026-06-12 以来 一度も回っていない）
          - name: k-neverover
            cmd: npm run test:k-neverover
            timeout: 15 # 実測 3分42秒
          # ★2026-08-28 追加：tests/ に在るのに ★npm script すら無かった★ 重い物（指示役の裁定②）
          #   ★重い物は 別の組で 最後に★（毎回 全部 回すと 試験が時間切れになる）
          # ★2026-08-28 追加★ タイヤ真値に置き換えた後 緑になったので 登録します
          #   （8/28 の裁定①で 比べる相手を「2026-05-31 の計算値」→「タイヤ計 8.39km」に変えた）
          - name: verify-9677（タイヤ真値・過大ゼロ＋−0.3〜−1.4%）
            cmd: npm run test:verify-9677
            timeout: 10 # 実測 35.7秒
          - name: road-distance（タイヤ真値 8.39km）
            cmd: npm run test:gate-road
            timeout: 10 # 実測 51.4秒
          # ★2026-08-28 訂正★ この道具は ★距離の合否を出しません★（今は「0台しか測れなければ赤」だけ）
          #   実物（0610-iPhoneSE 5.6分／0610-Android 9.8分）が 真値25.69km(約40分)と合っていない為。
          #   ⇒ 名前を実態に合わせました。★合否の線をどうするかは 指示役の裁定待ち★。
          - name: truedist-0610（測れた台数だけを見る・合否の線は未定）
            cmd: npm run test:truedist-0610
            timeout: 10 # 実測 54.4秒
          - name: address2-accuracy
            cmd: npm run test:gate-address2
            timeout: 15 # 実測 164.4秒
          - name: route-gain
            cmd: npm run test:gate-route-gain
            timeout: 15 # 実測 164.9秒
          - name: replay-realdevice（実機3台を 実エンジンに流す）
            cmd: npm run test:replay-realdevice
            timeout: 15 # 実測 134.4秒
          - name: realdevice-creep
            cmd: npm run test:gate-creep
            timeout: 10 # 実測 1分54秒
            # ★soft にはしない★＝無視できる赤は 無いのと同じ（指示役 2026-08-27）
            #   ★2026-08-27 の実測を基準にして「悪化したら赤」★にしてある
            #   （iPhone13 14.3m / iPhoneSE 10.2m / Android 12.6m・目指す所5mは 別の回で）
          - name: sim-cert
            cmd: npm run test:sim-cert
            timeout: 15 # 実測 6分19秒
          - name: truedist-kp
            cmd: npm run test:gate-kp
            timeout: 10
          - name: obd-engine
            cmd: npm run test:obd-engine
            timeout: 10
          - name: obd-quant
            cmd: npm run test:quant
            timeout: 10 # 実測 3分42秒
          - name: doppler-rejection
            cmd: npm run test:gate-doppler
            timeout: 10
          # ★ここから下は 20回のCIで一度も走っていない★（20分で打ち切られていたため）
          - name: cert-3env
            cmd: npm run test:gate-cert3env
            timeout: 15
          # ══ 非ブロック指定（soft）の棚卸し ══ 2026-08-28（指示役の裁定③）★実際に回して 数え直した★
          #   soft は continue-on-error ＝ ★赤でも ✓ が出ます★。
          #   前は 4本とも「本体未修正」と書いてありましたが ★2本は嘘★でした
          #   （本体ではなく ★実物（ファイル・材料）が 無くて 落ちていた★）。
          #   ⇒ 1本ずつ「なぜ soft か・いつ外すか」を tests/unit/mada-naoshite-inai.test.js の
          #     SOFT に書き、★本数を 機械が数えます★（増やしたら 赤）。
          #
          # ── ① 2026-08-29 … ★この組は 空になりました★（実物を運び／材料を向け直した）
          #     ＝★soft 4本は 全部「赤で正しい」＝中身が 赤★（未測定 0本）
          #     ★CI では 4本とも「pass」と 出ます。中身は ログを 読むしか ありません★
          - name: device-spread
            cmd: npm run test:gate-spread
            # ★2026-08-29 … 未測定 → ★本当に赤★ に 変わりました★
            #   それまでは tests/gate-realdevice-spread.js が ★repo に無く★
            #   MODULE_NOT_FOUND を soft が ✓ に 見せていた（CI 33146596665）。
            #   ★実物を 運びました★ ⇒ 本当に 回ります。
            #   見ているのは ★同じ走行を 3台で測った距離の開きが 運賃刻み(420m)を割らないか★
            #   ＝★司さんの核心「同社で 運賃割れ＝アウト」★
            #   実測(2026-08-29 手元 298.7秒): (A)3台収束 ★FAIL spread=790.2m(7.76%)★／
            #        (B)過大ゼロ PASS(−0.91%)／(C)creep ★FAIL 23.86m★／(D)seam=NO
            #   ★当時 679.9m → 今 790.2m＝開きが 広がっている★
            # ★いつ外すか★ seam（穴の継ぎ目の連続化）が 入った日。
            #   ★お金に関わる（運賃割れ）★ので 直すのは 指示役の指示があってから。
            timeout: 15
            soft: true # ★赤で正しい★（本体未修正・試験が先）
          - name: tunnel-continuity
            cmd: npm run test:gate-tunnel
            # ★2026-08-28 … 未測定 → ★本当に赤★ に変わりました★
            #   前は full（shimanami-*.json）を見ていて 両repoに 1本も無く throw していた。
            #   ★実物が在る .slim（実機走行の間引き）へ 向け直したので 本当に測れます★。
            #   実測: iPhoneSE で ★1フレーム 296.54m（上限 30.8m）★＝穴(dt=12秒の本物のトンネル)の出口で
            #        一括計上。★2026-08-29 実測＝3台とも 違反★:
            #        Android ★1,492.67m @i1830（2フレーム）★／iPhone13 ★1,443.78m @i865（3フレーム）★／
            #        iPhoneSE ★296.54m @i1578（1フレーム）★。★手元と CI は 完全に 一致★。
            #        （前は「Android/iPhone13 は 違反0」と 書いていました＝★私が tail で 終わりだけ 見て
            #          見ていない2台を 断言した★もの。★材料が切り貼りでない事は 確認済★）
            # ★いつ外すか★ 穴の出口で 一括計上しない実装が 入った日（bg-freeze と 同じ直し）。
            #   ★距離に乗る★ので 直すのは 指示役の指示があってから（distance_m 不可侵）。
            #   ※★多く取っているとは 言えません★（真値と比べた所は −1.36%/−1.51%）。
            timeout: 15
            soft: true # ★赤で正しい★（本体未修正・★距離に乗る★組）
          # ── ② 本当に赤（実エンジンが動いて 落ちている）──
          - name: bg-freeze
            cmd: npm run test:gate-bg-freeze
            # ★soft の理由★ ★本当に赤★（2026-08-28 実測 3.3秒）
            #   (A)ドン無し=FAIL … 画面復帰の ★1フレームで 180.00m★（予算 9.50m）
            #   (B)順序不変=PASS / (C)過大ゼロ=PASS（184.50m ≤ 理想 189.50m）
            #   試験が先に在り 本体（coast枝のtick予算）が 未修正＝★赤で正しい★。
            # ★いつ外すか★ pipeline-distance.js の coast を tick 予算でクランプした日。
            #   ★距離に乗る★ので 直すのは 指示役の指示があってから（distance_m 不可侵）。
            #   ※★多く取っているとは 言えません★（真値と比べた所は −1.36%/−1.51%）。
            timeout: 15
            soft: true # ★赤で正しい★（本体未修正・★距離に乗る★組）
          - name: fare-history
            cmd: npm run test:gate-fare-history
            # ★soft の理由★ ★赤で正しい★（★試験を 先に 書いた・本体 js/fare-history.js は まだ 無い★）
            #   今 料金を保存する所は ★上書き1件だけ★（js/firebase.js:346）＝★戻せません★。
            #   C1 で 社長が変えられるようにする＝★戻せない物を触らせる★ので ★戻す道を先に作る★。
            #   実測(2026-08-29): ★9本 見て 9本とも 赤★（本体が 無い＝正しい赤）
            # ★いつ外すか★ js/fare-history.js を 作って 9本 全部 緑になった日。
            #   ★線を 緩めて 緑にするのは 不可★
            # ★実測は 1秒未満だが、うちの決まりで timeout は ★10分以上★
            #   （tests/unit/workflows-no-silent-cancel.test.js が 縛っている）
            timeout: 10
            soft: true # ★赤で正しい★（試験が先・本体未実装）
          - name: gnss-degraded
            cmd: npm run test:gate-gnss-degraded
            # ★soft の理由★ ★本当に赤★（2026-08-28 実測 18.9秒）
            #   実機3台の走行に 生弦+10%膨張を注入 → 平滑後が 真値(ノイズ無し)を超えた:
            #     android +0.49% OK ／ ★iphonese +0.85% NG★ ／ ★iphone13-noisy +0.83% NG★（許容 0.5%）
            #   ★これは「試験が先」ではありません★＝この見張りは PASS する前提で書かれています。
            #   ⇒ ★合わせるべき線に 届いていない★状態。
            # ★いつ外すか★ ①線(ε=0.5%)が正しいか ②実機の劣化で再現するか を測って 決着した日。
            #   ★実機の劣化GPSでの再現＝未測定★（今 赤なのは ★合成ノイズ★の上での話）。
            #   実機3台の実走行そのものでは 過大ゼロ・タイヤ計比 −0.93%（2026-08-28 実測）。
            timeout: 15
            soft: true # ★赤・①の物差しのみ★（②代行では 天井の中・決着待ち）

    steps:
      # ★sparse-checkout★ 3,308MB → 約65MB（js/tests/scripts/package* + roads-ehime だけ）
      #   ゲートが読む物は実測で確定させてある。増やす時は「何を読むか」を測ってから足すこと。
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            js
            tests
            scripts
            package.json
            package-lock.json
            data/roads-ehime.js
            # ★2026-08-28 追加★ address2-accuracy が読む町ポリゴン（1.7MB）
            #   ★足す前に「何を読むか」を 実測しました★（CIが「町ポリゴン無し」で赤になって分かった）
            #   ＝★手元では data/ が全部 在るので 気づけません★。★CIが教えてくれた★物です。
            data/town-polygons-ehime.js
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}
        continue-on-error: ${{ matrix.soft == true }}

  # ★★ここが再発防止の本体★★
  #   `cancelled` は緑でも赤でもないので、「緑を確認してから進む」の網をすり抜ける。
  #   ここで ★success 以外は全部赤★ にして、打ち切られたら気づけるようにする。
  cert-gate-result:
    name: cert-gate 総合結果
    runs-on: ubuntu-latest
    needs: gate
    if: always()
    timeout-minutes: 5
    steps:
      - name: 結果を確かめる（cancelled / timed_out も失敗として扱う）
        run: |
          r="${{ needs.gate.result }}"
          echo "認定ゲートの結果: $r"
          if [ "$r" = "success" ]; then
            echo "cert-gate: 全部の必須ゲートが完走して緑"
            exit 0
          fi
          echo "::error::cert-gate が success ではありません（結果=$r）。"
          echo "::error::★cancelled / timed_out も「守れていない」として赤にしています★"
          echo "::error::（2026-08-02以前は cancelled が20回続いても誰も気づけなかった）"
          exit 1
