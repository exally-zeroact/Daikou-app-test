# Property tests (2026-05-17 新規・Stage 1 Step E・Layer 2)
# tests/property/ 配下の fast-check 述語を CI 実行
name: Property tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run property tests
        run: npx vitest run tests/property
