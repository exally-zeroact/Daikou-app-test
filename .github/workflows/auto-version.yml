name: Auto Update sw.js CACHE_NAME

# トリガー：sw.js とワークフロー以外の変更が main に push された時
on:
  push:
    branches: [main]
    paths-ignore:
      - 'sw.js'
      - '.github/workflows/**'
      - 'README.md'

# git push に必要な権限
permissions:
  contents: write

# 連続 push 時の race condition 抑止: 古い workflow をキャンセルし最新だけ実行
concurrency:
  group: auto-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-cache-name:
    runs-on: ubuntu-24.04
    steps:
      # ─── 1. リポジトリをチェックアウト ───
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 自動コミットを正常に push できるように fetch-depth: 0
          fetch-depth: 0
          # GITHUB_TOKEN を使う（自動付与）
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─── ★1.5 この push で sw.js が すでに 変わっていたら 何も しない★ ───
      #   ★2026-08-30 追加★ 付け直すと ★もう1回 建ってしまう★（clone 4分27秒が 丸ごと 無駄）
      - name: すでに 版名が 入っているか 見る
        id: sumi
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qx 'sw.js'; then
            echo "already=yes" >> $GITHUB_OUTPUT
            echo "★この push で sw.js が すでに 変わっています＝何も しません★"
          else
            echo "already=no" >> $GITHUB_OUTPUT
          fi

      # ─── 2. short SHA を取得 ───
      - name: Get short SHA
        id: sha
        if: steps.sumi.outputs.already != 'yes'
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      # ─── 3. sw.js の CACHE_NAME を書き換え ───
      - name: Update CACHE_NAME in sw.js
        if: steps.sumi.outputs.already != 'yes'
        run: |
          NEW_NAME="daikome-${{ steps.sha.outputs.short_sha }}"
          # CACHE_NAME = 'XXX' の XXX 部分を置換（シングル/ダブルクォート両対応）
          sed -i -E "s/(const CACHE_NAME = )['\"][^'\"]*['\"]/\1'$NEW_NAME'/" sw.js
          echo "Updated CACHE_NAME to: $NEW_NAME"
          echo "--- sw.js head ---"
          head -20 sw.js

      # ─── 4. 変更があれば自動コミット + push ───
      - name: Commit and push if changed
        if: steps.sumi.outputs.already != 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # ★2026-10-17★ 押し返された時に rebase で sw.js が ぶつかっていた（10-16）＝取り直して 付け直す形を 道具に 移した
          #   中身と 試験＝scripts/cache-name-oshi.sh ／ tests/unit/cache-name-oshi.test.js
          # ★設計変更宣言 (2026-05-29 PM・[skip ci] 削除): Vercel も その合図で deploy を 止めるので 付けない。
          #   workflow の 連鎖は paths-ignore: 'sw.js' で 防いでいる。
          bash scripts/cache-name-oshi.sh main
