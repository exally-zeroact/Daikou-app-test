name: Auto Update sw.js CACHE_NAME

# ★★2026-08-30 直し：本番ビルドが 1回の 変更で 2回 走っていた★★
#   前の形（実測）
#     ①PRを merge → Vercel が ★1回目★ を建てる（この時 sw.js は ★まだ 古い版名★）
#     ②この workflow が sw.js を 書き換えて もう1コミット push
#     ③Vercel が ★2回目★ を建てる（客に 届くのは こちら）
#   ⇒★①は 捨て玉★。clone に 1回 4分27秒 かかるので、そのぶん 丸ごと 無駄。
#     今日 daikou-app だけで 7ビルド、うち ★3本が この 2回目★ でした。
#
#   ★直した形★
#     ・PR の 枝に いる うちに sw.js を 書き換える（下の stamp-on-pr）
#       ⇒ merge した時には ★もう 新しい版名が 入っている★＝ビルドは ★1回★
#     ・main 側は ★残す（保険）★。ただし
#       ★その push で sw.js が すでに 変わっているなら 何も しない★
#       （でないと 版名を 付け直して また もう1回 建ってしまう）
#
#   ★保険を 消していません★: PR を 通さず main に 直に push した時は
#   今までどおり main 側が 版名を 付けます（その時だけ 2回 建ちます）。
#   ⇒★止まっても 客に 古い js が 配られる事は ありません★

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sw.js'
      - '.github/workflows/**'
      - 'README.md'
  pull_request:
    types: [opened, synchronize, reopened]

# git push に必要な権限
permissions:
  contents: write

# 連続 push 時の race condition 抑止: 古い workflow をキャンセルし最新だけ実行
concurrency:
  group: auto-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── ★PR の 枝で 先に 版名を 付ける（これで 本番ビルドが 1回に なる）★ ───
  stamp-on-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（PR の 枝そのもの）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # ★HEAD^ を 見るので 2つ 要る★（1つだと 門が 落ちる）
          fetch-depth: 2

      # ★★2026-08-30 直し（★自分で ループを 作った★）★★
      #   はじめの形は ★版名を 付ける → push → その push で また 自分が 走る★
      #   ⇒ 新しい SHA で また 別の 版名に なるので ★永久に 止まりません★
      #   ⇒ 実際に ★2回 回りました★（e579b3c4 → e9db6ac4）。すぐ 止めました。
      #   ⇒★止め方＝直前の コミットで sw.js が すでに 変わっているなら 何も しない★
      #     （main 側と 同じ門。1回 付けたら それ以上 付けない）
      - name: すでに 版名が 入っているか 見る
        id: sumi
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qx 'sw.js'; then
            echo "already=yes" >> $GITHUB_OUTPUT
            echo "★直前の コミットで sw.js が すでに 変わっています＝何も しません★"
          else
            echo "already=no" >> $GITHUB_OUTPUT
          fi

      - name: 版名を 付ける（中身が 変わっていない時は 何も しない）
        if: steps.sumi.outputs.already != 'yes'
        run: |
          SHORT=$(git rev-parse --short=7 HEAD)
          NEW_NAME="daikome-${SHORT}"
          OLD_NAME=$(grep -oE "const CACHE_NAME = ['\"][^'\"]*['\"]" sw.js | head -1)
          echo "今の版名: $OLD_NAME"
          sed -i -E "s/(const CACHE_NAME = )['\"][^'\"]*['\"]/\1'$NEW_NAME'/" sw.js
          if git diff --quiet sw.js; then
            echo "★版名は すでに 同じ＝何も しません★"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "chore: 版名を 先に 付ける（daikome-${SHORT}・本番ビルドを 1回に する）"
          # ★押せなかったら 赤にする（黙って 通さない）★
          #   ここが 通らなくても main 側の 保険が 効くので 客への 影響は ありません。
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
          echo "★版名を $NEW_NAME に しました★"

  update-cache-name:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # ─── 1. リポジトリをチェックアウト ───
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 自動コミットを正常に push できるように fetch-depth: 0
          fetch-depth: 0
          # GITHUB_TOKEN を使う（自動付与）
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─── ★1.5 この push で sw.js が すでに 変わっていたら 何も しない★ ───
      #   （PR の 枝で 先に 付けてある時。ここで 付け直すと ★もう1回 建ってしまう★）
      - name: すでに 版名が 入っているか 見る
        id: sumi
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qx 'sw.js'; then
            echo "already=yes" >> $GITHUB_OUTPUT
            echo "★この push で sw.js が すでに 変わっています＝何も しません★"
          else
            echo "already=no" >> $GITHUB_OUTPUT
          fi

      # ─── 2. short SHA を取得 ───
      - name: Get short SHA
        id: sha
        if: steps.sumi.outputs.already != 'yes'
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      # ─── 3. sw.js の CACHE_NAME を書き換え ───
      - name: Update CACHE_NAME in sw.js
        if: steps.sumi.outputs.already != 'yes'
        run: |
          NEW_NAME="daikome-${{ steps.sha.outputs.short_sha }}"
          # CACHE_NAME = 'XXX' の XXX 部分を置換（シングル/ダブルクォート両対応）
          sed -i -E "s/(const CACHE_NAME = )['\"][^'\"]*['\"]/\1'$NEW_NAME'/" sw.js
          echo "Updated CACHE_NAME to: $NEW_NAME"
          echo "--- sw.js head ---"
          head -20 sw.js

      # ─── 4. 変更があれば自動コミット + push ───
      - name: Commit and push if changed
        if: steps.sumi.outputs.already != 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet sw.js; then
            echo "No changes to sw.js (CACHE_NAME already up-to-date)"
            exit 0
          fi
          
          git add sw.js
          # ★設計変更宣言 (2026-05-29 PM・[skip ci] 削除):
          #   旧: [skip ci] でこのワークフロー自身の連鎖実行を防止
          #   問題: 司さん「反映遅くなった」 真因 = Vercel も [skip ci] を解釈して deploy skip
          #         → auto-update CACHE_NAME bump 後の sw.js が Vercel に反映されない事象。
          #   新: [skip ci] 削除。workflow 連鎖は paths-ignore: 'sw.js' (= L8) で既に防止済 (= 冗長)。
          git commit -m "chore: auto-update CACHE_NAME to daikome-${{ steps.sha.outputs.short_sha }}"
          # 連続 push との race 対策: 失敗時に rebase してリトライ (最大 3 回)
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed (attempt $attempt)"
              exit 0
            fi
            echo "Push failed at attempt $attempt, rebasing..."
            git pull --rebase origin main || exit 1
          done
          echo "Failed after 3 attempts"
          exit 1
