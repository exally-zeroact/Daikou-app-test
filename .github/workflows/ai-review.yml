# AI Review (multi-LLM consensus) for PRs touching js/
# Stage 5 (2026-05-18 新規)
#
# トリガー: pull_request (js/ 配下に変更がある場合のみ条件分岐で起動)
# 必要 secrets:
#   ANTHROPIC_API_KEY  Claude Haiku API キー
#   GEMINI_API_KEY     Gemini Flash API キー
# 出力: consensus_result.json (= verdict OK / WARNING / FAIL)

name: AI Review

on:
  pull_request:
    paths:
      - 'js/**'
  # 手動再実行用 (= secrets 設定後の動作確認・過去 PR 再実行)
  workflow_dispatch:

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build PR diff
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git diff "$BASE_SHA" "$HEAD_SHA" -- 'js/' > pr-diff.txt
          else
            # workflow_dispatch: 直近 commit の diff (= secrets 動作確認用)
            git diff HEAD~1 HEAD -- 'js/' > pr-diff.txt || echo "" > pr-diff.txt
          fi
          echo "diff_bytes=$(wc -c < pr-diff.txt)" >> "$GITHUB_OUTPUT"

      - name: Run multi-LLM consensus
        if: steps.diff.outputs.diff_bytes != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PR_DIFF="$(cat pr-diff.txt)" node scripts/zeroact-test-commons/ai/multi-llm-consensus.js

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consensus_result
          path: consensus_result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment on PR
        if: always() && steps.diff.outputs.diff_bytes != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('consensus_result.json')) return;
            const r = JSON.parse(fs.readFileSync('consensus_result.json', 'utf8'));
            const body = [
              '## 🤖 Multi-LLM Consensus Review',
              '',
              '**Verdict:** `' + r.verdict + '`',
              '',
              '**Reasoning:** ' + (r.reasoning || '(none)'),
              '',
              '<details><summary>Per-model output</summary>',
              '',
              '```json',
              JSON.stringify(r.models || {}, null, 2),
              '```',
              '',
              '</details>'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
