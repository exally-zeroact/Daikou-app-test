# AI Bug Hunter (= Claude Sonnet に js の3本を読ませて未知バグを探す)
# Stage 5 (2026-05-18 新規) → ★2026-08-18 定時をやめて「手で押した時だけ」に変更★
#
# トリガー: ★workflow_dispatch のみ★（Actions → AI Bug Hunter → Run workflow）
# 必要 secrets:
#   ANTHROPIC_API_KEY  Claude API キー
# 出力:
#   bug-hunt-report.json (= risks: [...])
#   GitHub Issue 自動作成
#
# ★★定時(毎週月曜0時 JST)をやめた理由＝実測 2026-08-18★★
#   ① ★作ったIssueを誰も読んでいない★
#      本番15件 + テスト12件 = 計27件。★27件 全部 OPEN・コメント0件・1件も閉じられていない★
#      （2026-05-31 から3ヶ月ぶん）
#   ② ★「0 risks」の週は 見つからなかったのではなく 失敗だった★
#      本番15回のうち7回が「0 risks」。中身を開いたら全部 失敗:
#        #22/#19/#15/#14 = JSON parse error（答えが max_tokens=4096 で途中で切れた。
#                          切れる位置は毎回 7,100〜7,800 付近＝毎回 同じ所で力尽きている）
#        #11/#10/#9      = execution failed
#      ＝★成功したのは15回中8回(53%)★。しかも Issue のタイトルは「(0 risks)」・
#        本文は「No risks detected (or execution failed).」＝
#        ★失敗した週と、本当に安全だった週が 見た目で区別できない（赤を緑と書いている）★
#   ③ ★成功した週も 毎週ほぼ同じ10件を言い直している★
#      前回の指摘を覚えていないので、08-09 と 08-16 の1件目がほぼ同一文だった。
#
#   ⇒ 中身（distance_m の二重ガード・GPS直線距離の混入 等）は的外れではないが、
#     ★出口が無い（誰も読まない・1件も直らない）★ので、定時で作り続ける意味が無い。
#     ★消していない★＝使いたい日に手で押せば、今までどおり動く。
#   ⇒ ★もう一度 定時に戻す日は、先に ② を直す事★
#      （max_tokens を上げる／失敗時はIssueを作らずCIを赤にする／前回のIssueを渡す）

name: AI Bug Hunter

on:
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      # ★sparse-checkout (2026-08-03)★ cert-gate と同じ原因で死んでいた。
      #   実測: 15:49:46 開始 → 16:04:50 終了 ＝ ★きっかり15分で打ち切り(cancelled)★。
      #   repo 3,308MB のうち data/ が 3,293.8MB（99.6%）。checkout だけで数分持っていかれる。
      #   この道具が読むのは ★js/meter.js / js/map-matcher.js / js/gps-worker.js の3本と
      #   .github/workflows/*.yml だけ★（ai-bug-hunter.js の TARGET_FILES で実測）。
      #   data/ は1バイトも要らない。
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            js
            scripts
            .github
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AI bug hunter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # ★設計変更宣言 (2026-05-18・⑰ 配線時): 旧 ID claude-sonnet-4-20250514 →
          # Claude 4 系最新 claude-sonnet-4-5-20250929 に更新
          # repo variable ANTHROPIC_MODEL があれば override 可能
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-5-20250929' }}
        run: node scripts/zeroact-test-commons/ai/ai-bug-hunter.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-hunt-report
          path: bug-hunt-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Create issue from report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('bug-hunt-report.json')) return;
            const r = JSON.parse(fs.readFileSync('bug-hunt-report.json', 'utf8'));
            const risks = Array.isArray(r.risks) ? r.risks : [];
            if (r.error) {
              console.log('[bug-hunter] execution error: ' + r.error);
            }
            const today = new Date().toISOString().slice(0, 10);
            const title = '[ai-bug-hunter] weekly report ' + today + ' (' + risks.length + ' risks)';
            const body = [
              '## 🤖 AI Bug Hunter — Weekly Report',
              '',
              '**Date:** ' + today,
              '',
              '**Model:** ' + (r.model || '(unknown)'),
              '',
              '**Summary:** ' + (r.summary || '(none)'),
              '',
              '### Detected Risks',
              ''
            ];
            if (risks.length === 0) {
              body.push('No risks detected (or execution failed).');
            } else {
              for (const risk of risks) {
                body.push('- **[' + (risk.severity || '?') + ']** `' + (risk.category || '?') + '` @ ' + (risk.location || '?'));
                body.push('  - ' + (risk.description || ''));
                if (risk.recommendation) body.push('  - 推奨対処: ' + risk.recommendation);
              }
            }
            if (r.error) {
              body.push('');
              body.push('**Error:** `' + r.error + '`');
            }
            body.push('');
            body.push('<details><summary>Raw JSON</summary>');
            body.push('');
            body.push('```json');
            body.push(JSON.stringify(r, null, 2));
            body.push('```');
            body.push('</details>');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: body.join('\n'),
              labels: ['ai-bug-hunter', 'weekly-report']
            });

  # ★cancelled を緑扱いしない (2026-08-03)★
  #   cert-gate が20回すり抜けたのと同じ形。cancelled は緑でも赤でもないので、
  #   一覧をぱっと見ても「動いていない」ことに気づけない。success 以外は赤にする。
  bug-hunter-result:
    name: AI Bug Hunter 総合結果
    runs-on: ubuntu-latest
    needs: hunt
    if: always()
    timeout-minutes: 5
    steps:
      - name: 結果を確かめる（cancelled / timed_out も失敗として扱う）
        run: |
          r="${{ needs.hunt.result }}"
          echo "AI Bug Hunter の結果: $r"
          if [ "$r" = "success" ]; then exit 0; fi
          echo "::error::AI Bug Hunter が success ではありません（結果=$r）。"
          echo "::error::★cancelled / timed_out も「走っていない」として赤にしています★"
          exit 1
