# Weekly AI Bug Hunter (= Claude Sonnet 4 で未知バグ探索)
# Stage 5 (2026-05-18 新規)
#
# トリガー: schedule 毎週月曜 0 時 JST (= UTC 日曜 15:00)
# 必要 secrets:
#   ANTHROPIC_API_KEY  Claude API キー
# 出力:
#   bug-hunt-report.json (= risks: [...])
#   GitHub Issue 自動作成 (= 司さんへの通知)

name: AI Bug Hunter

on:
  schedule:
    # 毎週月曜 JST 0:00 (= UTC 日曜 15:00)
    - cron: '0 15 * * SUN'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run AI bug hunter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # ★設計変更宣言 (2026-05-18・⑰ 配線時): 旧 ID claude-sonnet-4-20250514 →
          # Claude 4 系最新 claude-sonnet-4-5-20250929 に更新
          # repo variable ANTHROPIC_MODEL があれば override 可能
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-5-20250929' }}
        run: node scripts/zeroact-test-commons/ai/ai-bug-hunter.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bug-hunt-report
          path: bug-hunt-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Create issue from report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('bug-hunt-report.json')) return;
            const r = JSON.parse(fs.readFileSync('bug-hunt-report.json', 'utf8'));
            const risks = Array.isArray(r.risks) ? r.risks : [];
            if (r.error) {
              console.log('[bug-hunter] execution error: ' + r.error);
            }
            const today = new Date().toISOString().slice(0, 10);
            const title = '[ai-bug-hunter] weekly report ' + today + ' (' + risks.length + ' risks)';
            const body = [
              '## 🤖 AI Bug Hunter — Weekly Report',
              '',
              '**Date:** ' + today,
              '',
              '**Model:** ' + (r.model || '(unknown)'),
              '',
              '**Summary:** ' + (r.summary || '(none)'),
              '',
              '### Detected Risks',
              ''
            ];
            if (risks.length === 0) {
              body.push('No risks detected (or execution failed).');
            } else {
              for (const risk of risks) {
                body.push('- **[' + (risk.severity || '?') + ']** `' + (risk.category || '?') + '` @ ' + (risk.location || '?'));
                body.push('  - ' + (risk.description || ''));
                if (risk.recommendation) body.push('  - 推奨対処: ' + risk.recommendation);
              }
            }
            if (r.error) {
              body.push('');
              body.push('**Error:** `' + r.error + '`');
            }
            body.push('');
            body.push('<details><summary>Raw JSON</summary>');
            body.push('');
            body.push('```json');
            body.push(JSON.stringify(r, null, 2));
            body.push('```');
            body.push('</details>');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: body.join('\n'),
              labels: ['ai-bug-hunter', 'weekly-report']
            });
