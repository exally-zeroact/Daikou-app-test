# Daikome テスト CI
# push 毎に Vitest (business.js / meter.js ユニットテスト) + replay-mm.js (MM 回帰) を実行
# mm-regression.yml (既存) は MM 専用の重い検証を担当・本 workflow は軽量な常時 gate
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest (business.js / meter.js ユニットテスト)
        run: npm run test

      - name: Run replay-mm (MM 回帰テスト)
        run: npm run test:replay

      # ★2026-08-27 追加：package.json に在るのに どの workflow にも入っていなかった2本★
      #   どちらも check:logic の中に居たが、check:logic 自体が CI に無かった。
      - name: Run replay-display (画面の距離の滑らかさ)
        run: npm run test:replay-display # 実測 36秒

      - name: Run mm-priority (停車中 Worker B 出力0 → 業務距離 加算ゼロ)
        run: npm run test:mm-priority # 実測 0.7秒

      # ★2026-08-28 追加：tests/ に在るのに ★npm script すら無かった★ 物（指示役の裁定②）
      #   15本 全部を 1本ずつ実際に回して、★軽くて緑で 意味が在る物★を ここに載せました。
      - name: Run replay-pipeline (距離エンジンの再生)
        run: npm run test:replay-pipeline # 実測 1.0秒

      - name: Run replay-obd-main (OBDメイン distance_m ≤ 真値＝過大ゼロ)
        run: npm run test:replay-obd-main # 実測 10.0秒

      - name: Run display-even-pace (画面の距離が 等速で進む)
        run: npm run test:display-even-pace # 実測 0.2秒

      - name: Run display-stop-restart (停車→再発進で 飛ばさない)
        run: npm run test:display-stop-restart # 実測 0.2秒
