# Daikome テスト CI
# push 毎に Vitest (business.js / meter.js ユニットテスト) + replay-mm.js (MM 回帰) を実行
# mm-regression.yml (既存) は MM 専用の重い検証を担当・本 workflow は軽量な常時 gate
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ★commit の文に 実在の字（本物の住所・名前）と「司さんの家」の札を 入れさせない★（2026-10-10）
  #   一覧は repo に置かない＝secret KINSHI_JI（1行に 1語）。無ければ「未測定」で 赤（飛ばさない）。
  #   当たっても 字は出さない（公開の CI の記録は 誰でも読める）。出すのは 数と commit の頭だけ。
  kinshi-commit-msg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 門の自己確認
        run: node scripts/kinshi-commit-msg.mjs --self-test
      - name: この push・PR の commit の文を見る
        shell: bash
        env:
          KINSHI_JI: ${{ secrets.KINSHI_JI }}
          EV: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EV" = "pull_request" ]; then R="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then R="$GITHUB_SHA^..$GITHUB_SHA"
          else R="$BEFORE..$GITHUB_SHA"; fi
          node scripts/kinshi-commit-msg.mjs --range "$R" | tee kinshi-msg.out
          grep -q "^✓ commit の文の 実在の字 0 件" kinshi-msg.out

  # ★公開 repo に 実在の 字を 戻さない 見張り★（Castally の nomiya-app c30af57 の段を 逐語で 写した・メールの門の段は除く＝作者の欄は commit 文の門が見る・2026-10-11）
  kinshi-ji:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # ★Castally の CI と同じ版★（古い版は 24 の Linux で double free で落ちた＝7dfcaac で直った・24 は 下の job で回す）
      # ★公開 repo に 実在の 字（司さん・会社・お客さんの 本物）を 戻さない★（2026-10-10）
      #   一覧は repo に 置かない＝secret KINSHI_JI（1行に 1語）。無ければ「未測定」で 赤。
      #   指紋（変数 KINSHI_JI_FINGER）と 違えば 赤＝secret が 縮んだ・壊れた を 止める。
      #   当たっても 字は 出さない（公開の CI ログは 誰でも 読める）。zip（xlsx 等）は ほどいて 中まで 見る。
      - name: 実在の字が戻っていないか（一覧は secret）
        timeout-minutes: 10
        # 本体が 何も 言わずに 終わる（main が 走らない 等）のを 緑に しない＝終わりの 行が 出たかも 見る
        # shell: bash＝-eo pipefail（書かないと -e だけで、tee の 前の 終わり値が 捨てられる）
        shell: bash
        run: |
          npm run kinshi | tee kinshi.out
          grep -q "^✓ 実在の 字 0 件" kinshi.out
        env:
          KINSHI_JI: ${{ secrets.KINSHI_JI }}
          KINSHI_JI_FINGER: ${{ vars.KINSHI_JI_FINGER }}

      - name: 実在の字の見張りの自己確認
        timeout-minutes: 10
        # 全部 通って、しかも 29 組 以上・確かめた 回数 239 以上の 時だけ 緑（組の 中の 歯を 消しても 割れる）
        shell: bash
        run: |
          node tests/kinshi-ji.test.mjs --self-test | tee kinshi-self.out
          sh scripts/ci-yuka.sh kinshi-self.out 29 239

      # ★押す commit の 中身の 門（.githooks/pre-push-kinshi.mjs）の 自己確認★（2026-10-11）
      #   門 自身は 手元の push で 走る。ここでは 門が 壊れていないか（入れて 消した 字を 赤に する 等）を 見る。
      - name: 押す commit の 中身の 門の自己確認
        shell: bash
        run: |
          node .githooks/pre-push-kinshi.mjs --self-test | tee push-self.out
          sh scripts/ci-yuka.sh push-self.out 13 34

      # ★床の 物差し（scripts/ci-yuka.sh）の 自己確認＝ubuntu の awk で 233・234x 等が 赤に なるか★（2026-10-11）
      - name: 床の物差しの自己確認
        shell: bash
        run: |
          sh scripts/ci-yuka.sh --self-test | tee yuka-self.out
          sh scripts/ci-yuka.sh yuka-self.out 20

  # ★見張りだけを node 24 でも回す★（Castally の nomiya-app c30af57 の job を逐語で写した）
  kinshi-node24:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # ★床の 物差し（scripts/ci-yuka.sh）の 自己確認＝ubuntu の awk で 233・234x 等が 赤に なるか★（2026-10-11）
      - name: 床の物差しの自己確認（node 24 の job）
        shell: bash
        run: |
          sh scripts/ci-yuka.sh --self-test | tee yuka-self.out
          sh scripts/ci-yuka.sh yuka-self.out 20

      - name: 実在の字が戻っていないか（node 24）
        shell: bash
        run: |
          node tests/kinshi-ji.test.mjs | tee kinshi24.out
          grep -q "^✓ 実在の 字 0 件" kinshi24.out
        env:
          KINSHI_JI: ${{ secrets.KINSHI_JI }}
          KINSHI_JI_FINGER: ${{ vars.KINSHI_JI_FINGER }}
      - name: 実在の字の見張りの自己確認（node 24）
        shell: bash
        run: |
          node tests/kinshi-ji.test.mjs --self-test | tee kinshi24-self.out
          sh scripts/ci-yuka.sh kinshi24-self.out 29 239
      # 押す commit の 中身の 門も node 24 で（手元の 機械の node は 24・2026-10-11）
      - name: 押す commit の 中身の 門の自己確認（node 24）
        shell: bash
        run: |
          node .githooks/pre-push-kinshi.mjs --self-test | tee push24-self.out
          sh scripts/ci-yuka.sh push24-self.out 13 34

  unit-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest (business.js / meter.js ユニットテスト)
        run: npm run test

      # ★★PDFに 字体を 丸ごと 埋めない（全アプリ 共通）★★ 2026-09-26
      #   ★★実測 2026-09-26★★ この 見張りは 2026-09-05 に 作られたが
      #     CI に 入っていたのは ★Exally-test と daikou-seikyu-test の 2本だけ★。
      #     rakually-test ・rakually ・Daikou-app の 3本は ★一度も 走っていなかった★。
      #     （vitest は tests/**/*.test.js だけ 拾うので .test.mjs は 自動では 入らない）
      #   ⇒ ★名指しで 走らせる★（--self-test も＝見張りが 生きているか）
      - name: PDFに 字体を 丸ごと 埋めていないか
        run: node tests/pdf-font-weight.test.mjs && node tests/pdf-font-weight.test.mjs --self-test

      - name: Run replay-mm (MM 回帰テスト)
        run: npm run test:replay

      # ★2026-08-27 追加：package.json に在るのに どの workflow にも入っていなかった2本★
      #   どちらも check:logic の中に居たが、check:logic 自体が CI に無かった。
      - name: Run replay-display (画面の距離の滑らかさ)
        run: npm run test:replay-display # 実測 36秒

      - name: Run mm-priority (停車中 Worker B 出力0 → 業務距離 加算ゼロ)
        run: npm run test:mm-priority # 実測 0.7秒

      # ★2026-08-28 追加：tests/ に在るのに ★npm script すら無かった★ 物（指示役の裁定②）
      #   15本 全部を 1本ずつ実際に回して、★軽くて緑で 意味が在る物★を ここに載せました。
      - name: Run replay-pipeline (距離エンジンの再生)
        run: npm run test:replay-pipeline # 実測 1.0秒

      - name: Run replay-obd-main (OBDメイン distance_m ≤ 真値＝過大ゼロ)
        run: npm run test:replay-obd-main # 実測 10.0秒

      - name: Run display-even-pace (画面の距離が 等速で進む)
        run: npm run test:display-even-pace # 実測 0.2秒

      - name: Run display-stop-restart (停車→再発進で 飛ばさない)
        run: npm run test:display-stop-restart # 実測 0.2秒
