# Daikome テスト CI
# push 毎に Vitest (business.js / meter.js ユニットテスト) + replay-mm.js (MM 回帰) を実行
# mm-regression.yml (既存) は MM 専用の重い検証を担当・本 workflow は軽量な常時 gate
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest (business.js / meter.js ユニットテスト)
        run: npm run test

      - name: Run replay-mm (MM 回帰テスト)
        run: npm run test:replay

      # ★2026-08-27 追加：package.json に在るのに どの workflow にも入っていなかった2本★
      #   どちらも check:logic の中に居たが、check:logic 自体が CI に無かった。
      - name: Run replay-display (画面の距離の滑らかさ)
        run: npm run test:replay-display # 実測 36秒

      - name: Run mm-priority (停車中 Worker B 出力0 → 業務距離 加算ゼロ)
        run: npm run test:mm-priority # 実測 0.7秒
