# Playwright E2E (2026-05-17 新規・Stage 1 Step E・Layer 3)
# tests/e2e/ 配下の Playwright spec を CI 実行（e2e＝chromium で 全部・webkit＝iPhone の 中身で 運転手の 道と 本人の 明細だけ・2026-10-17）
name: Playwright E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-24.04
    # ★15分では 足りなくなった★ 2026-10-08（総なめ 295本＝実測 約 840秒・915秒で 時間切れ＝「cancelled」と 出た）
    # ★25分でも 足りなくなった★ 2026-10-20（468本・テスト線 d4e00cb で 464本 通した 所で 25分に 当たり cancelled・失敗 0）
    #   本番③は 22.3分。workers を 増やすと 試験どうしの 当たりが 新しく 出得る＝今は 上限を 上げる（前と 同じ 形）
    # ★38分の 段でも 足りなく なる★ 2026-10-22（テスト線 420c9c2 で 678本＝35.6分・残り 2.4分。retries の 再走りで 越える・対立役）
    #   段 50分・job 60分 に 上げる（公開の repo＝Actions の 時間で お金は 増えない）
    # ★50分にも 近づいた★ 2026-10-23（本番 1823b2b で 45.8分・残り 4分・指示役の 知らせ）＝段 65分・job 75分
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # ★段にも 時間の 上限★ 2026-10-20（固まった 時は job の cancelled で なく 段の 失敗で 出す＝手で 止めた 時と 区別する・webkit と 同じ 形）
        timeout-minutes: 65
        # ★10本 落ちたら そこで 止める★ 2026-10-20（倉庫が 引けない 等で 一斉に 落ちた 時に 上限を 使い切らず、まとめの 行も 出る・対立役）
        run: npx playwright test --retries=2 --max-failures=10
        env:
          CI: true

      - name: Upload trace on failure
        if: failure() || cancelled() # 時間切れの 時も 足跡を 上げる（2026-10-20）
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

  # ★iPhone の Safari の 中身（WebKit）で 運転手が 一番 触る 道だけ 開く★ 2026-10-17
  #   前は chromium だけで、WebKit を 1回も 測っていなかった（指示役 10-16）。
  #   組は playwright.webkit.config.js の WEBKIT_KUMI（業務の 道・保存・許可・料金表・本人の 明細）。
  #   公開 repo なので Actions の 費用は 0。chromium の job とは 別に 並べて 走る。
  #   ★retries は 0★ 初めて 測る 中身なので、揺れも 1回で 赤に する（2 だと 3回目に 通れば 緑に 化ける・対立役）
  webkit:
    runs-on: ubuntu-24.04
    # ★20分では apt の 取り込みが 遅い 日に 足りない★ 2026-10-23（テスト線 91d58ec・285f497・本番 1823b2b の 3回とも
    #   「Install Playwright webkit」の apt 中に job の 20分で cancelled＝試験は 0本 走った）＝job 40分・取り込みの 段に 25分
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright webkit
        timeout-minutes: 25
        run: npx playwright install --with-deps webkit

      - name: Run Playwright tests (webkit)
        # ★段にも 時間の 上限★ 組は 約4分。worker が 止まらないと job の 20分まで 使われ「cancelled」に なり、手で 止めた 時と 区別が つかない＝ここで 段の 失敗として 出す（対立役 10-17）
        timeout-minutes: 10
        run: npx playwright test --config=playwright.webkit.config.js --retries=0
        env:
          CI: true

      - name: Upload trace on failure
        if: failure() || cancelled()  # 時間切れの 時も 足跡を 上げる（対立役 10-17）
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-webkit
          path: test-results/
          retention-days: 7
