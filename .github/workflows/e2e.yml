# Playwright E2E (2026-05-17 新規・Stage 1 Step E・Layer 3)
# tests/e2e/ 配下の Playwright spec を CI 実行（e2e＝chromium で 全部・webkit＝iPhone の 中身で 運転手の 道と 本人の 明細だけ・2026-10-17）
name: Playwright E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-24.04
    # ★4つに 割る★ 2026-11-02（コンサル：1本で 36〜40分＝kensan が 毎回 40分 待つ・24時間で 7.9h）
    #   playwright の --shard で ファイル単位に 4つへ 割り、別の 箱で 並べて 走らせる。
    #   ★見立て（対立役 2026-11-02・run 41354705441 の 行の 時刻から）★ 箱ごとの 試験 7.4／9.2／13.5／6.4分＋支度 80秒
    #   ＝一番 長い 箱 約15分（3つ目に 重い nyuryoku-yomenai-tomeru 48本 5.4分が 固まる）・まとめを 足して 待ち 約17分（前は 36〜40分）
    #   ★試験の 中身・retries・max-failures は 前と 同じ★（max-failures は 割った 1つごと）。
    #   ★fail-fast は 切る★＝1つ 赤でも 残りを 最後まで 走らせ、全部の 赤を 出す。
    #   ★cancel-in-progress は 入れない★（10-30 の 決め）
    #   本数の 合計は 下の e2e-matome が 数えて「割る 前の 一覧と 同じ 本数を 走らせたか」を 縛る。
    # 上限：前の 1本は 段 65分・job 75分。割った 1つは 1/4 の 見込みだが、偏りと retries の 再走りを 見て 段 40分・job 50分
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # ★段にも 時間の 上限★ 2026-10-20（固まった 時は job の cancelled で なく 段の 失敗で 出す＝手で 止めた 時と 区別する・webkit と 同じ 形）
        timeout-minutes: 40
        # ★10本 落ちたら そこで 止める★ 2026-10-20（倉庫が 引けない 等で 一斉に 落ちた 時に 上限を 使い切らず、まとめの 行も 出る・対立役）
        # ★blob★ は 4つを 1つに 合わせて 数える 為（list は 今まで通り ログに 出る）
        run: npx playwright test --retries=2 --max-failures=10 --shard=${{ matrix.shard }}/4 --reporter=list,blob
        env:
          CI: true

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          overwrite: true # 赤の 箱だけ やり直した 時に 前の 回の 同じ 名前と ぶつからない

      - name: Upload trace on failure
        if: failure() || cancelled() # 時間切れの 時も 足跡を 上げる（2026-10-20）
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # ★4つの 合計を 1か所で 数える★ 2026-11-02
  #   ①4つの blob を 合わせ、まとめ（一覧 / passed / flaky / failed / skipped）を 1行で 出す＝数え直しは ここを 見る
  #     ★赤の 日も 出す★（箱が 赤でも 先に 数える・対立役 注2）
  #   ②一覧の 本数＝4つの 合計 か（blob が 1つ 欠けたら 赤）
  #   ③★skipped が 上限を 越えたら 赤★（走らなかった 試験は skipped に 入る＝本数の 一致だけでは 必ず 緑に なる・対立役 注1）
  #     今の skipped は 1本（nyuryoku-uriage-nashi-keihi.spec.js の test.skip(!process.env.KE_E)）。わざと 飛ばす 試験を 足したら SKIP_JOUGEN も 上げる
  #   ④最後に 4つ 全部が success か（1つでも 抜け・cancelled・failure なら 赤）
  e2e-matome:
    runs-on: ubuntu-24.04
    needs: e2e
    if: ${{ always() }}
    timeout-minutes: 15
    env:
      SKIP_JOUGEN: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 4つの blob を 集める
        uses: actions/download-artifact@v4
        with:
          path: all-blob
          pattern: blob-report-*
          merge-multiple: true

      - name: 合わせて 数える
        run: |
          npx playwright merge-reports --reporter=json ./all-blob > merged.json
          npx playwright test --list --reporter=json > listed.json
          node -e "
            const m=require('./merged.json').stats, l=require('./listed.json');
            const cnt=(s)=>(s.specs||[]).reduce((a,x)=>a+(x.tests||[]).length,0)+(s.suites||[]).reduce((a,x)=>a+cnt(x),0);
            const ichiran=(l.suites||[]).reduce((a,x)=>a+cnt(x),0);
            const goukei=m.expected+m.unexpected+m.flaky+m.skipped;
            const jougen=Number(process.env.SKIP_JOUGEN);
            console.log('E2E まとめ: 一覧 '+ichiran+'本・4つの 合計 '+goukei+'本（passed '+m.expected+' / flaky '+m.flaky+' / failed '+m.unexpected+' / skipped '+m.skipped+'・skipped の 上限 '+jougen+'）');
            let ng=0;
            if(!(ichiran>0)){console.error('★一覧が 0本★');ng=1}
            if(goukei!==ichiran){console.error('★4つの 合計が 一覧と 違う（blob が 欠けた）★');ng=1}
            if(m.skipped>jougen){console.error('★skipped が 上限を 越えた＝走らなかった 試験が 在る★');ng=1}
            if(m.unexpected>0){console.error('★failed が 在る★');ng=1}
            process.exit(ng);
          "

      - name: 4つ 全部が 緑か
        if: ${{ always() }}
        run: |
          echo "e2e（4つ）の 結果: ${{ needs.e2e.result }}"
          test "${{ needs.e2e.result }}" = "success"

  # ★iPhone の Safari の 中身（WebKit）で 運転手が 一番 触る 道だけ 開く★ 2026-10-17
  #   前は chromium だけで、WebKit を 1回も 測っていなかった（指示役 10-16）。
  #   組は playwright.webkit.config.js の WEBKIT_KUMI（業務の 道・保存・許可・料金表・本人の 明細）。
  #   公開 repo なので Actions の 費用は 0。chromium の job とは 別に 並べて 走る。
  #   ★retries は 0★ 初めて 測る 中身なので、揺れも 1回で 赤に する（2 だと 3回目に 通れば 緑に 化ける・対立役）
  webkit:
    runs-on: ubuntu-24.04
    # ★20分では apt の 取り込みが 遅い 日に 足りない★ 2026-10-23（テスト線 91d58ec・285f497・本番 1823b2b の 3回とも
    #   「Install Playwright webkit」の apt 中に job の 20分で cancelled＝試験は 0本 走った）＝job 40分・取り込みの 段に 25分
    timeout-minutes: 40
    # ★apt を 使わない★ 2026-10-23（25分の 段でも apt の 取り込み 107件が 終わらなかった＝テスト線 5f1776a）
    #   iPhone 向けの 道具と 依存が 入った 公式の 箱で 走らせる。箱の 版は package-lock の @playwright/test と 揃える（下の 段で 見る）
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Playwright の 版が 箱と 同じか
        # 違うと 箱の 中の 道具が 見つからず 赤に なる＝先に 訳の 出る 形で 止める
        run: node -e "const v=require('@playwright/test/package.json').version; if(v!=='1.60.0'){console.error('箱は 1.60.0・入ったのは '+v+'＝e2e.yml の image を 揃える');process.exit(1)}"

      - name: Run Playwright tests (webkit)
        # ★段にも 時間の 上限★ worker が 止まらないと job の 上限まで 使われ「cancelled」に なり、手で 止めた 時と 区別が つかない＝ここで 段の 失敗として 出す（対立役 10-17）
        # ★10分→16分★ 2026-11-02（対立役 止1）組が 増えて 約4分→8〜10分（直近15回 8:13〜9:52・8回が 9:36 以上＝上限まで 8秒）。
        #   LINE の 2本（6本・手元 約25秒）を 足すと 半分ほどの 回が 試験は 緑の まま 時間切れで 赤に なる 見立て。
        #   16分＝一番 長い 回 9:52 ＋ 約6分（job の 40分の 中）。固まった 時は 今まで通り 段の 失敗で 出る
        timeout-minutes: 16
        run: npx playwright test --config=playwright.webkit.config.js --retries=0
        env:
          CI: true

      - name: Upload trace on failure
        if: failure() || cancelled()  # 時間切れの 時も 足跡を 上げる（対立役 10-17）
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-webkit
          path: test-results/
          retention-days: 7
