name: OSM POI Auto Update

# ===============================================================
# 47都道府県分の POI 自動生成（C案: Geofabrik PBF + osmium）
#
# 月次（毎月1日 03:00 JST）に Geofabrik から地方PBFを取得して
# POI タグでフィルタ → 都道府県別 .poly で切出し → input/{pref}/poi.geojson
# 続いて build-poi.js を回して data/poi-{pref}.js を生成
#
# osm-update.yml（道路）の後段にあたるイメージ。週次の道路更新の翌週末に走る。
# ===============================================================

on:
  schedule:
    - cron: '0 18 1 * *'   # 毎月1日 18:00 UTC = 翌2日 03:00 JST
  workflow_dispatch:
    inputs:
      region:
        description: '対象地方（テスト用に1地方ずつ実行可能）'
        required: true
        default: 'shikoku'
        type: choice
        options:
          - shikoku
          - hokkaido
          - tohoku
          - kanto
          - chubu
          - kansai
          - chugoku
          - kyushu
          - all

concurrency:
  group: poi-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-poi:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: osmium-tool インストール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          osmium --version

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 都道府県 .poly 生成（最新の meta.json から）
        run: node scripts/build-poly-files.js

      - name: 対象地方
        id: target
        run: |
          INPUT="${{ github.event.inputs.region || 'all' }}"
          echo "region=$INPUT" >> $GITHUB_OUTPUT
          echo "対象: $INPUT"

      - name: POI 一括取得 → input/{pref}/poi.geojson
        env:
          REGION: ${{ steps.target.outputs.region }}
        run: |
          set -e
          chmod +x scripts/fetch-poi-bulk.sh
          bash scripts/fetch-poi-bulk.sh "$REGION"

      - name: build-poi.js で data/poi-{pref}.js を生成
        run: |
          set -e
          for f in input/*/poi.geojson; do
            PREF=$(basename "$(dirname "$f")")
            echo "▶ build-poi: $PREF"
            node scripts/build-poi.js "$f" "$PREF"
          done

      - name: サイズ・件数レポート
        run: |
          echo "=== 生成された data/poi-{pref}.js ==="
          ls -la data/poi-*.js 2>/dev/null | head -50 || true
          echo
          echo "=== 県別件数 ==="
          for f in data/poi-*.js; do
            PREF=$(basename "$f" .js | sed 's/^poi-//')
            CNT=$(node -e "
              const t = require('fs').readFileSync('$f','utf8');
              const m = t.match(/window\.[A-Z_]+ = (\{[\s\S]*\});/);
              if (!m) { console.log('?'); process.exit(0); }
              const o = JSON.parse(m[1]);
              console.log((o.pois || []).length);
            ")
            printf "  %-12s %s\n" "$PREF" "$CNT"
          done

      - name: 変更検出
        id: diff
        run: |
          git add -A input/ data/
          if [ -n "$(git diff --cached --name-only)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ 変更あり"
            git diff --cached --stat | head -30
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 変更なし（コミットスキップ）"
          fi

      - name: 自動コミット & プッシュ
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(poi): OSM自動更新 $(date -u +'%Y-%m') C案PBF [skip ci]"
          # 並行ワークフロー（auto-version 等）の push と衝突した場合は rebase してリトライ
          for i in 1 2 3; do
            if git push; then
              echo "✅ push 成功 (試行 $i)"
              break
            fi
            echo "⚠️ push 拒否 (試行 $i) → fetch + rebase してリトライ"
            git fetch origin main
            git pull --rebase origin main
            sleep 2
          done

      - name: 失敗時のサマリ
        if: failure()
        run: |
          echo "::error::POI更新失敗。前月の data/poi-*.js は残っているのでアプリ継続。"
