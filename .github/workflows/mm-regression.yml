name: MM Regression

on:
  push:
    branches: [main]
    paths:
      - 'js/map-matcher.js'
      - 'js/meter.js'
      - 'js/roads-decoder.js'
      - 'tests/**'
      - '.github/workflows/mm-regression.yml'
  pull_request:
    paths:
      - 'js/map-matcher.js'
      - 'js/meter.js'
      - 'js/roads-decoder.js'
      - 'tests/**'
      - '.github/workflows/mm-regression.yml'
  schedule:
    # 毎週月曜 03:00 JST (= 18:00 UTC 日曜) に Tier1 OSRM cron 実行
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# 連続 push 時の race を抑止: 古い workflow をキャンセル・最新のみ実行
# 古い test 結果は cancel で破棄・最新 commit の test 結果のみ反映
concurrency:
  group: mm-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Map Matching Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate fixtures
        run: node tests/lib/generate-fixtures.js

      - name: Replay map-matcher (Tier2 self)
        run: node tests/replay-mm.js

      - name: Meter MM-priority integration test
        run: node tests/meter-mm-priority.js

      - name: Tier1 OSRM /match (skips if OSRM_ENDPOINT secret unset)
        env:
          OSRM_ENDPOINT: ${{ secrets.OSRM_ENDPOINT }}
          OSRM_PROFILE: ${{ secrets.OSRM_PROFILE }}
        # cron 実行と workflow_dispatch のみ Tier1 を回す (PR/push では時間節約)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node tests/tier1-osrm.js
        continue-on-error: true

      - name: Tier4 Google Directions (skips if API key unset)
        env:
          GOOGLE_DIRECTIONS_API_KEY: ${{ secrets.GOOGLE_DIRECTIONS_API_KEY }}
          GOOGLE_MAX_REQUESTS_PER_RUN: '5'
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node tests/tier4-google.js
        continue-on-error: true

      - name: Compare against baselines
        run: node tests/compare-baseline.js

      - name: Generate PR report
        if: always()
        run: node tests/generate-pr-report.js > pr-report.md

      - name: Upload latest.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: data/test-results/

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const marker = '🚗 Map Matching Regression';
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      # ★設計変更宣言 (2026-05-22・X3・test-results auto-commit 廃止):
      #   旧: data/test-results/{latest,history}.json を・main に force-commit + push
      #   問題: .gitignore line 50 で除外しているのに・CI が・force-commit するため
      #         ローカル push と・CI auto-commit が・race (= 本 セッションで X1/X2 push
      #         共に・1 回ずつ reject + merge 必要だった)
      #   修正: commit step 削除・artifact (= 上記 Upload latest.json artifact step) のみで・retain
      #   影響なし: compare-baseline.js / generate-pr-report.js は・同 run 内・新生成
      #             latest.json を読む (= main repo 過去版 を・読む箇所 ゼロ)
