      <!-- ★設計変更宣言 (2026-05-20 司さん指示・横画面右カラム復元 + inline style 保険):
           landscape 空車時 btn-area に 履歴 → 業務終了 → 代行開始 を縦並びで表示。
           portrait は CSS で完全非表示 (= screenIdle 内で表示)。
           JS onclick は portrait 同等 (= onHistory/onBusinessEnd) で副作用なし。
           inline style で border/color を直接指定し・CSS specificity 問題 / PWA キャッシュ問題でも
           司さん指示の色 (履歴=青/業務終了=赤) を確実に適用。 -->
      <button

        onclick="onHistory()"

      >
