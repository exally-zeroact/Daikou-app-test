        <!-- ★OBD 接続チップ (2026-06-11・最小化スッキリ rev・青バー常駐・全画面で見える&押せる)★:
             GPSピルと同じ「ドット + OBD」の小ピル。接続状態は #obdDot の色だけ(緑=接続済 / 半透明白=未接続)。
             絵文字/緑ベタ塗り/速度重複は廃止(車速はメーター本体に表示)。タップで接続/接続中タップで切断。
             業務開始→走行と画面が遷移しても常駐。Web Bluetooth 非対応(iPhone)は .is-disabled。bindObdUI が 500ms 毎に更新。 -->
        <button id="obdChip" type="button" class="gps-pill obd-chip">
          <span class="gps-dot" id="obdDot"></span>
          <span id="obdChipLabel">OBD</span>
        </button>
        <div

          id="surchargeBadge"
          style="display: none"
          onclick="toggleSurcharge()"
