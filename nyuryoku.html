<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ダイコメ 入力</title>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>"
    />
    <!-- ============================================================
         ★★その日に 入れる 分（入力）★★ 2026-09-08
           ★司さん★「フッターに作れってこやろがぼけ」
             ⇒ 入力は ★下の 帯（フッター）の 1枚★。
           ★司さん★「なんなんどはみ出てたりぐちゃぐちゃになんど
                     他のアプリは入力どやってしよんどぼけ」
             ⇒ ★表（table）を やめました★
               表に 日の 帯を 混ぜたので 列が 合わず、欄が はみ出ていた。
             ⇒ ★飲み屋（Castally）の 入力と 同じ 形★に そろえる
               ＝ nomiya-uriage.html の .frow（★ラベルを 上・欄を 下★に 縦に 並べる）
               ＝ 代行請求書アプリも 同じ（finput / type="date"）
           ★司さん（前の 指示）★「カレンダーで日付選んでできるようにしろ
                                  その日だけ見せてスッキリさせろ」
             ⇒ ★1日ぶんだけ★ 出す（月ぜんぶを 並べない）
           ★何を 入れるか★
             ・PayPay で 受け取った 分 …… 日ごと（dk_day_extras）
             ・実費（高速代・橋代・会社が 足した 物）… 1回の 業務ごと（dk_shift_edits）
           ★読み書きの 決まりは js/jippi-hozon.js の 1か所★
           ★元データ（dk_shifts / dk_trips）には 1行も 書きません★
           ★お金の 計算（料金・距離）は この 画面に 在りません★
         ============================================================ -->
    <style>
      :root {
        --blue: #007aff;
        --blue-d: #0a5fd0;
        --ink: #14243d;
        --muted: #5a6b82;
        --bg: #f2f7ff;
        --line: #dbe7f7;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        text-size-adjust: 100%;
      }

      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 12px 12px 18px;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }

      .logo {
        font-size: 19px;
        font-weight: 800;
        color: var(--blue-d);
      }

      .tag {
        margin-left: 7px;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        background: var(--blue);
        border-radius: 999px;
        padding: 3px 9px;
        vertical-align: middle;
      }

      .linkbtn {
        background: none;
        border: none;
        color: var(--blue);
        font-size: 13px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }

      .sub {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 10px;
      }

      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        margin-bottom: 12px;
      }

      .card-ttl {
        font-size: 15px;
        font-weight: 800;
        border-left: 5px solid var(--blue);
        padding-left: 8px;
        margin-bottom: 10px;
      }

      /* ★★入力の 形は 飲み屋（Castally）と 同じ★★ 2026-09-08
         ★司さん★「他のアプリは入力どやってしよんどぼけ」
         nomiya-uriage.css の .frow / .flabel / .finput を そのまま 借りています。
         ★ラベルを 上・欄を 下★＝どんな 幅でも 折り返さない・はみ出さない。 */
      .frow {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 10px;
      }

      .flabel {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
      }

      .finput {
        width: 100%;
        padding: 11px 12px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        font-size: 16px;
        font-family: inherit;
        color: var(--ink);
        background: #fff;
        outline: none;
      }

      .finput:focus {
        border-color: var(--blue);
      }

      .fnum {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .f2 {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      /* ★日を 選ぶ（1日ぶんだけ 見せる）★ */
      .hibar {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .navb {
        background: #eef3fa;
        border: none;
        border-radius: 10px;
        padding: 11px 12px;
        font-size: 14px;
        font-weight: 700;
        font-family: inherit;
        color: var(--blue-d);
        cursor: pointer;
        white-space: nowrap;
        flex: 0 0 auto;
      }

      .hiji {
        font-size: 16px;
        font-weight: 800;
        text-align: center;
        margin-top: 8px;
      }

      /* ★車ごとの かたまり★ */
      .sha {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 10px;
      }

      .sha-na {
        font-size: 14px;
        font-weight: 800;
        color: var(--blue-d);
        margin-bottom: 8px;
      }

      .hint {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.6;
      }

      .note {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
        margin-top: 10px;
      }

      .msg {
        text-align: center;
        color: var(--muted);
        padding: 18px 10px;
        font-size: 13px;
      }

      .err {
        background: #fdecea;
        color: #a1281e;
        border: 1px solid #f5c2bd;
        border-radius: 10px;
        padding: 9px 11px;
        font-size: 13px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div><span class="logo">ダイコメ</span><span class="tag">入力</span></div>
        <div>
          <button class="linkbtn" id="btnLogout">ログアウト</button>
        </div>
      </div>
      <div class="sub" id="sub">読み込み中…</div>

      <!-- ★日を 選ぶ★（司さん「カレンダーで日付選んで／その日だけ見せてスッキリ」） -->
      <div class="card">
        <div class="hibar">
          <button class="navb" id="prevD" type="button">‹ 前の日</button>
          <input class="finput" type="date" id="hiSel" />
          <button class="navb" id="nextD" type="button">次の日 ›</button>
        </div>
        <div class="hiji" id="hiJi">—</div>
      </div>

      <div class="card">
        <div class="card-ttl">PayPay で 受け取った 分</div>
        <div class="frow">
          <span class="flabel">この日に 受け取った 分（円）</span>
          <input class="finput fnum" type="number" inputmode="numeric" min="0" id="ppYen" />
          <span class="hint">現金でも 請求書でもない 分。打つと すぐ 保存されます。</span>
        </div>
      </div>

      <div class="card">
        <div class="card-ttl">高速代・橋代 など（車ごと）</div>
        <div id="shaList"></div>
        <div class="msg" id="msg" style="display: none"></div>
        <div class="err" id="err" style="display: none"></div>
        <div class="note">
          その日に 走った 車が 出ます。<b>売上・距離の 数字は 変わりません</b>。
        </div>
      </div>
    </div>

    <script src="js/dk-config.js"></script>
    <script src="js/dk-env-badge.js" data-modoru="office"></script>
    <script src="js/dk-session.js"></script>
    <script src="js/car-name.js"></script>
    <script src="js/jippi-hozon.js"></script>
    <script>
      (function () {
        'use strict';

        var SESS = null;
        var COMPANY = null;
        var LOAD = DKSession.newLoadState();
        var HI = ''; // 'YYYY-MM-DD'（今 見ている 日）
        var RAW = { shifts: [], labels: [], kinds: [] };
        var EDITS = {}; // shift_id → 手で入れた1行
        var NAMAE = {}; // 端末ID → 車の名前
        var PP = 0; // その日の PayPay

        var $ = function (id) {
          return document.getElementById(id);
        };
        function esc(s) {
          return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) {
            return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c];
          });
        }
        function showErr(m) {
          $('err').textContent = m;
          $('err').style.display = m ? 'block' : 'none';
        }
        function showMsg(m) {
          $('msg').textContent = m;
          $('msg').style.display = m ? 'block' : 'none';
        }
        // ★断られた 時に「どの会社に 書こうとして 断られたか」まで 出す★
        function saveErr(msg, r) {
          try {
            var st = r && r.status;
            if (st === 401 || st === 403) {
              var nm = (COMPANY && COMPANY.name) || '(会社が選ばれていません)';
              return showErr(msg + ' ' + nm + ' には書き込めません。');
            }
          } catch (_) {
            /* 名前が 出せなくても 元の 言い方は 出す */
          }
          return showErr(msg);
        }

        function hiKey(d) {
          return (
            d.getFullYear() +
            '-' +
            ('0' + (d.getMonth() + 1)).slice(-2) +
            '-' +
            ('0' + d.getDate()).slice(-2)
          );
        }
        function hiLabel(ymd) {
          var d = new Date(ymd + 'T00:00:00');
          return (
            d.getFullYear() +
            '年' +
            (d.getMonth() + 1) +
            '月' +
            d.getDate() +
            '日（' +
            '日月火水木金土'.charAt(d.getDay()) +
            '）'
          );
        }
        function ugokasu(ymd, n) {
          var d = new Date(ymd + 'T00:00:00');
          d.setDate(d.getDate() + n);
          return hiKey(d);
        }
        // ★その日の 0時から 次の日の 0時まで★（端末の 時間で 切る＝画面と 同じ 感覚）
        function hiRange(ymd) {
          var d = new Date(ymd + 'T00:00:00');
          var to = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0, 0);
          return { from: d.toISOString(), to: to.toISOString() };
        }

        HI = hiKey(new Date());

        // ---------- 起動 ----------
        DKSession.ensure().then(function (s) {
          if (!s) return DKSession.goLogin();
          SESS = s;
          loadCompany();
        });

        $('btnLogout').onclick = function () {
          DKSession.logout();
        };
        $('prevD').onclick = function () {
          HI = ugokasu(HI, -1);
          hiWoDasu();
          load();
        };
        $('nextD').onclick = function () {
          HI = ugokasu(HI, 1);
          hiWoDasu();
          load();
        };
        $('hiSel').onchange = function () {
          if (!$('hiSel').value) return;
          HI = $('hiSel').value;
          hiWoDasu();
          load();
        };
        $('ppYen').onchange = function () {
          savePP($('ppYen').value);
        };

        function hiWoDasu() {
          $('hiSel').value = HI;
          $('hiJi').textContent = hiLabel(HI);
        }
        hiWoDasu();

        function loadCompany() {
          DKSession.myCompanies(SESS, 'company_id,name')
            .then(function (r) {
              if (r && r.noUid) return 'unknown';
              if (!r || !r.ok) return null;
              return r.json();
            })
            .then(function (j) {
              if (j === 'unknown') {
                $('sub').textContent = '会社が分かりません。もう一度ログインしてください。';
                return;
              }
              var pick = DKSession.pickCompany(j);
              if (!pick || pick.mode !== 'one') {
                $('sub').textContent = '会社が選ばれていません。会社設定から選んでください。';
                return;
              }
              COMPANY = pick.company;
              $('sub').textContent = COMPANY.name || '';
              load();
            })
            .catch(function () {
              $('sub').textContent = '会社が読めませんでした。';
            });
        }

        function load() {
          if (!COMPANY) return;
          var r = hiRange(HI);
          var q =
            'dk_shifts?select=shift_id,device_id,started_at&company_id=eq.' +
            encodeURIComponent(COMPANY.company_id) +
            '&started_at=gte.' +
            encodeURIComponent(r.from) +
            '&started_at=lt.' +
            encodeURIComponent(r.to) +
            '&order=started_at.asc&limit=200';
          function soft(path) {
            return DKSession.softList(SESS, path, LOAD);
          }
          Promise.all([
            DKSession.rest(SESS, q).then(function (x) {
              if (!x.ok) throw new Error('shifts');
              return x.json();
            }),
            soft('dk_shift_edits?select=*&limit=2000'),
            soft('dk_device_labels?select=*&limit=500'),
            soft('dk_expense_kinds?select=*&order=sort_order.asc&limit=200'),
            soft('dk_day_extras?select=*&pay_date=eq.' + encodeURIComponent(HI) + '&limit=5'),
          ])
            .then(function (res) {
              RAW.shifts = Array.isArray(res[0]) ? res[0] : [];
              RAW.labels = Array.isArray(res[2]) ? res[2] : [];
              // ★使う 印が 付いている 物だけ★／★取れなければ 今まで通りの 3つ★
              RAW.kinds = (Array.isArray(res[3]) ? res[3] : []).filter(function (k) {
                return k && k.active !== false;
              });
              if (!RAW.kinds.length) {
                RAW.kinds = [
                  { kind_id: 'toll', label: '高速代', sort_order: 10 },
                  { kind_id: 'bridge', label: '橋代', sort_order: 20 },
                  { kind_id: 'other', label: 'その他', sort_order: 30 },
                ];
              }
              EDITS = {};
              (Array.isArray(res[1]) ? res[1] : []).forEach(function (e) {
                if (e && e.shift_id) EDITS[e.shift_id] = e;
              });
              PP = 0;
              (Array.isArray(res[4]) ? res[4] : []).forEach(function (x) {
                if (x && String(x.pay_date).slice(0, 10) === HI) {
                  PP = JippiHozon.seisuu(x.paypay_yen);
                }
              });
              render();
              DKSession.showUnknownBar(LOAD, load);
            })
            .catch(function () {
              showErr('読み込めませんでした。通信を確認してください。');
            });
        }

        function render() {
          $('ppYen').value = PP || '';
          var ids = [];
          RAW.shifts.forEach(function (s) {
            if (s && s.device_id && ids.indexOf(s.device_id) < 0) ids.push(s.device_id);
          });
          // ★車の 名前は 1か所（js/car-name.js）で 決める★＝UUIDは 画面に 出さない
          NAMAE = CarName.nameMap(ids, RAW.labels);

          if (!RAW.shifts.length) {
            $('shaList').innerHTML = '';
            showMsg('この日は まだ 走った 記録が ありません。（PayPay は 上に 入れられます）');
            return;
          }
          showMsg('');
          var kinds = RAW.kinds;
          var html = '';
          RAW.shifts.forEach(function (s) {
            var e = EDITS[s.shift_id] || {};
            html +=
              '<div class="sha"><div class="sha-na">' +
              esc(NAMAE[s.device_id] || '車') +
              '</div>' +
              kinds
                .map(function (k) {
                  return (
                    '<div class="frow"><span class="flabel">' +
                    esc(k.label) +
                    '（円）</span>' +
                    '<input class="finput fnum" type="number" inputmode="numeric" min="0"' +
                    ' data-sid="' +
                    esc(s.shift_id) +
                    '" data-f="' +
                    esc(k.kind_id) +
                    '" value="' +
                    (JippiHozon.ima(e, k.kind_id) || '') +
                    '"></div>'
                  );
                })
                .join('') +
              '</div>';
          });
          $('shaList').innerHTML = html;
          bindYen();
        }

        function bindYen() {
          Array.prototype.forEach.call(
            document.querySelectorAll('#shaList [data-sid]'),
            function (i) {
              i.onchange = function () {
                saveJippi(i.getAttribute('data-sid'), i.getAttribute('data-f'), i.value);
              };
            }
          );
        }

        // ★保存の 決まりは js/jippi-hozon.js の 1か所★（ここは 呼ぶだけ）
        function saveJippi(shiftId, field, value) {
          if (!COMPANY) return;
          JippiHozon.saveJippi(SESS, shiftId, COMPANY.company_id, EDITS[shiftId], field, value)
            .then(function (body) {
              showErr('');
              EDITS[shiftId] = body;
            })
            .catch(function (r) {
              saveErr('保存できませんでした。通信を確認してください。', r);
            });
        }

        function savePP(value) {
          if (!COMPANY) return;
          JippiHozon.savePaypay(SESS, COMPANY.company_id, HI, value)
            .then(function (v) {
              showErr('');
              PP = v;
              $('ppYen').value = v || '';
            })
            .catch(function (r) {
              saveErr('PayPay の分を保存できませんでした。', r);
            });
        }
      })();
    </script>
    <script src="js/jimusho-footer.js"></script>
  </body>
</html>
