<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ダイコメ 売上表</title>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>"
    />
    <style>
      :root {
        --blue: #007aff;
        --blue-d: #0a5fd0;
        --ink: #14243d;
        --muted: #5a6b82;
        --bg: #f2f7ff;
        --line: #dbe7f7;
        --danger: #e0483d;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 22px 18px 60px;

        /* ★★iPhone の 時計・電池の 下に 潜るのを 止める★★ 2026-09-18（司さん「見切れとる」）
           ★viewport-fit=cover を 付けると 画面の 端まで 広がる★＝
           逃がし（safe-area）を 書かないと ★上の 字が 時計に 重なる★。
           下の 帯は js/jimusho-footer.js が 既に 逃がしている（padding-bottom）。 */
        padding-top: max(22px, env(safe-area-inset-top));
        padding-left: max(18px, env(safe-area-inset-left));
        padding-right: max(18px, env(safe-area-inset-right));
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;

        /* ★狭い画面では 名前と行き先ボタンを 上下に分ける（押し合って字が割れない）★ 2026-08-25 */
        flex-wrap: wrap;
        gap: 4px 12px;
      }

      .logo {
        font-weight: 800;

        /* ★詰めた★ 2026-09-05（20px→17px・他のアプリと 同じ 並び） */
        font-size: 17px;
        color: var(--blue-d);
      }

      .top .tag {
        font-size: 12px;
        font-weight: 700;
        color: #fff;
        background: var(--blue);
        border-radius: 999px;
        padding: 2px 10px;
        margin-left: 8px;

        /* ★狭い画面で「給料」の2文字が 縦に割れていた★（2026-08-25 実測 375px … 110 x 51＝2行）
           札の字は 折り返さない。 */
        white-space: nowrap;
      }

      .sub {
        color: var(--muted);
        font-size: 13px;

        /* ★詰めた★ 2026-09-05（16px→8px） */
        margin-bottom: 8px;
      }

      .linkbtn {
        background: none;
        border: none;
        color: var(--blue);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        padding: 4px 2px;
      }

      /* 管理画面の中に出している時は、その画面の上のリンク列を隠す */
      body.embedded .top,
      body.embedded .sub {
        display: none;
      }

      body.embedded .wrap {
        padding-top: 8px;
      }

      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;

        /* ★詰めた★ 2026-09-05（司さん「デカすぎる」）16px→12px / 14px→10px */
        padding: 12px;
        margin-bottom: 10px;
      }

      /* ★★日付を 左右の ボタンで 挟む★★ 2026-09-05（司さん「挟む 形に したら スッキリ」）
         ★前は flex-wrap: wrap★ だったので、日付の 字が 長い（実測 328px）と
         ★折り返して 日付が 上・ボタンが 下★の 2段に なっていました。
         ⇒ ★折り返さない★＝ボタンは 左右に 固定、日付は 真ん中で 縮む。 */
      .monthbar {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: space-between;
        flex-wrap: nowrap;
      }

      .monthbar .m {
        font-size: 18px;
        font-weight: 800;
        flex: 1 1 auto; /* ★真ん中で 縮む★ 2026-09-05 */
        min-width: 0;
        text-align: center;
        overflow-wrap: anywhere;
      }

      /* ★狭い画面で 押す物の字が1文字ずつ縦に割れる★（2026-08-25 実測・375px）
           給料 「‹ 前の月」 45 x 102（＝4行に割れていた）
           売上表 62 x 58 ／ 月次集計 72 x 58（＝2行）  ※1行なら 約34px
         原因：真ん中の「月の字」の箱が min-width で場所を先に取り、
               押す物だけが縮められていた（flex は 押す物から縮める）。
         直し方：月(年)の字を 上の行へ落として、押す物は 横1行で並べる。
                 ★480px より広い画面は 今まで通り（1文字も変えない）★ */

      /* ★★狭い画面でも 挟む形の まま★★ 2026-09-05（司さん「挟む 形に したら スッキリ」）
         ★前は ここで 日付を order:-1 で 上の 段へ 追い出していました★
         ⇒ 日付が 上・ボタンが 下の 2段（実測 日付 top=144 / ボタン top=179）
         ⇒ ★1段に 収める★＝日付の 字だけ 少し 小さくして 左右の ボタンで 挟む */
      @media (max-width: 480px) {
        .monthbar .m {
          font-size: 15px;
        }

        .navb {
          padding: 6px 10px;
        }
      }

      .navb {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 6px 14px;
        font-size: 15px;
        font-weight: 700;
        color: var(--blue-d);
        cursor: pointer;
        white-space: nowrap; /* ★1文字ずつ縦に割れない★ */ /* ★押す物は縮めない★ */

        /* ★挟む形★ 左右の ボタンは 縮まない（2026-09-05） */
        flex: 0 0 auto;
      }

      /* ===== 読める一覧＋バー (2026-08-09) =====
         司さん「全体的に表が見にくいから他のアプリの用に見せるようにしろ」
         7列の表はスマホで横に流れて読めなかった。1行を大きく、金額を主役にする。 */
      .seg {
        display: flex;
        gap: 6px;
        background: #e8f0fe;
        padding: 4px;
        border-radius: 12px;
      }

      .segb {
        flex: 1;
        border: none;
        background: none;
        border-radius: 9px;
        padding: 9px 4px;

        /* ★★札が 3つに なったので 字を 詰める★★ 2026-09-06（司さん「入力タブつくれよ」）
           ★実測★ 390px で 15px だと「実費を 入れる」が 2行に 割れた ⇒ 14px・折り返さない */
        font-size: 14px;
        white-space: nowrap;
        font-weight: 700;
        font-family: inherit;
        color: var(--blue-d);
        cursor: pointer;
      }

      .segb.on {
        background: var(--blue-d);
        color: #fff;
      }

      .row {
        border-bottom: 1px solid var(--line);
        padding: 12px 2px 11px;
      }

      .row:last-child {
        border-bottom: none;
      }

      .rhead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .rname {
        font-size: 16px;
        font-weight: 800;
        color: var(--ink);
        min-width: 0;
      }

      .ramt {
        font-size: 19px;
        font-weight: 800;
        color: var(--blue-d);
        white-space: nowrap;
      }

      .rbar {
        height: 7px;
        background: #e8f0fe;
        border-radius: 4px;
        margin: 7px 0 6px;
        overflow: hidden;
      }

      .rbar span {
        display: block;
        height: 100%;
        background: var(--blue);
        border-radius: 4px;
      }

      .rsub {
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.7;
      }

      .rmore {
        margin-top: 6px;
        background: none;
        border: none;
        padding: 4px 0;
        font-size: 13px;
        font-weight: 700;
        font-family: inherit;
        color: var(--blue);
        cursor: pointer;
      }

      .rdetail {
        margin-top: 8px;
        border-left: 3px solid var(--line);
        padding-left: 10px;
      }

      .dline {
        padding: 8px 0;
        border-bottom: 1px dashed var(--line);
      }

      .dline:last-child {
        border-bottom: none;
      }

      .dtop {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
      }

      .dsub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }

      .dedit {
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .totalrow {
        margin-top: 4px;
        border-top: 2px solid var(--line);
        padding-top: 12px;
      }

      .totalrow .rname,
      .totalrow .ramt {
        font-size: 20px;
      }

      .carname {
        font-weight: 700;
        color: var(--blue-d);
        background: none;
        border: none;
        border-bottom: 1px dashed var(--line);
        font-size: 14px;
        font-family: inherit;
        width: 8em;
        padding: 2px 0;
      }

      .carname:focus {
        outline: none;
        border-bottom-color: var(--blue);
      }

      .scroller {
        overflow-x: auto;
      }

      .expander {
        cursor: pointer;
        color: var(--blue);
        font-size: 12px;
        font-weight: 700;
        background: none;
        border: none;
        padding: 2px 6px;
      }

      .yen {
        width: 6.5em;
        text-align: right;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 6px;
        font-size: 13px;
        font-family: inherit;
      }

      .yen:focus {
        outline: none;
        border-color: var(--blue);
      }

      /* ★★入力タブの ますの 中では 幅いっぱい★★ 2026-09-06（司さん）
         ★実測★ 6.5em 固定だと 390px の 表から はみ出て 数字が 見えなかった */
      .msg {
        text-align: center;
        color: var(--muted);
        padding: 26px 10px;
        font-size: 14px;
      }

      .err {
        color: var(--danger);
        font-size: 13px;
        margin-top: 8px;
      }

      .saved {
        color: #1a8a4a;
        font-size: 12px;
        font-weight: 700;
      }

      .note {
        font-size: 12px;
        color: var(--muted);
        margin-top: 10px;
      }

      .setrow {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 14px;
      }

      .setlabel {
        font-weight: 700;
        color: var(--muted);
        font-size: 13px;
      }

      .hiku-na {
        font-weight: 700;
      }

      .hiku-chui {
        font-size: 12px;
        color: var(--muted);
      }

      /* ★★紙の 表★★ 2026-09-05（司さん「紙にして スクロールせんでええようにしろ」）
         ★司さんの 代行計算表2026.xlsb「売上表」と 同じ 罫線の 表★
         ★横に すべらせない★＝列の 幅を 決める（table-layout: fixed）
           6列なら 1列 57px＝「1,298,210」（11pxで 56px）が 1行で 入る */
      .kami-seg {
        flex-wrap: wrap;
      }

      .kami-mado {
        margin-top: 10px;
      }

      .moto-hyou > summary {
        cursor: pointer;
        color: var(--blue);
        font-weight: 700;
        padding: 10px 4px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div><span class="logo">ダイコメ</span><span class="tag">売上表</span></div>
        <div>
          <button class="linkbtn" id="btnLogout">ログアウト</button>
        </div>
      </div>
      <div class="sub" id="sub">読み込み中…</div>

      <!-- ★★操作は 1つの 箱に まとめる★★ 2026-09-05（司さん「デカすぎ・バランス悪すぎ」）
           ★前は 月えらび／引くもの／車ごと・日ごと が ★3つの 箱に 分かれて★ いました。
           ★実測★ 数字の 1行目まで ★447px＝1画面の 53%★＝★半分が 上の 塊★
           ⇒ 1つに まとめる。★中身は 1つも 減らしていません／押す 回数も 同じ★ -->
      <div class="card">
        <div class="monthbar">
          <button class="navb" id="prevM">‹ 前の月</button>
          <div class="m" id="monthLabel">—</div>
          <button class="navb" id="nextM">次の月 ›</button>
        </div>
        <div class="setrow" style="margin-top: 10px">
          <span class="setlabel">売上から引くもの</span>
          <!-- ★★入れた 実費は 全部 引く★★ 2026-10-24 件J（司さん「実費は足したもの全て引く形やないと経費の意味ないやないか」）
               前の「引く／引かない」の チェック・「何日から」・記録は 消した（選ぶ 形を やめた）。
               名前は 会社設定の「実費」の 名前（消した 物は 出さない・その 月に 額が 在れば 出す＝hikiNaNuru） -->
          <span class="hiku-na" id="dHiku"></span>
          <span class="hiku-chui">入れた 実費は 全部 引きます</span>
        </div>

        <!-- ★★売上表は PDF と 同じ 紙を そのまま 見せる★★ 2026-10-05
             （司さん「PDFつくっとんやけんそれを見せろや」「何をくどくど訳わからんこと見せとんど」）
             紙を 選ぶと ★その 紙が 画面に 出る★。押すと PDF。細かい 表と 実費を 直す 所は 下に 畳む。
             ★お金の 紙と 回数・距離の 紙は 別★（司さんの 決め・js/kami-hyou.js の 頭）。 -->
        <div class="seg kami-seg" id="kamiSeg" style="margin-top: 10px">
          <button class="segb on" id="kamiUri" type="button" data-shu="uri">売上</button>
          <button class="segb" id="kamiSoukou" type="button" data-shu="soukou">回数・距離</button>
        </div>
        <div id="kamiMado" class="kami-mado"></div>
        <div class="saved" id="kamiMsg"></div>
      </div>

      <div class="err" id="err" style="display: none"></div>
      <!-- ★知らせは 畳まない★（会社の 登録の 案内などが 畳まれて 見えなくなる・対立役 10-05） -->
      <div class="msg" id="msg" style="display: none"></div>

      <!-- ★★細かい 表と 実費を 直す 所は 畳む★★ 2026-10-05（消さない：入力の 画面が「売上表で 1回ずつ 直して」と 案内している） -->
      <details id="motoHyou" class="moto-hyou">
        <summary>一覧で 見る・実費を 直す</summary>
        <div class="card">
          <!-- ★車ごと／日ごと の切り替え (2026-08-09 司さん「1日おきと車おきで見れないかん」)★ -->
          <div class="seg" style="margin-top: 10px">
            <button class="segb on" id="segCar" type="button">車ごと</button>
            <button class="segb" id="segDay" type="button">日ごと</button>
            <!-- ★★入力は フッターの「入力」へ 出しました★★ 2026-09-07
               ★司さん★「フッターに作れってこやろがぼけ」
               ⇒ ここ（売上表）は ★見る 所★／打つ 所は ★下の 帯の「入力」★。
               ★打つ 所が 2か所 在ると どちらが 本当か 分からなく なる★ -->
          </div>
          <!-- ★★昔の 罫線の 表（kamiTbl）は 消した★★ 2026-10-06（司さん 写真「これが新しくPDFの紙に変わって綺麗になるならええけど」）
               ¥119,880 と ¥2,220 が くっついて マスから はみ出していた。中身（車ごとの 売上・実費・回数・距離）は
               上の 紙（売上／回数・距離）に 全部 出る＝ここは 実費を 1回ずつ 直す 一覧だけ 残す。 -->
          <!-- ★★どこで 入れるかを 書く★★ 2026-09-06（司さん「橋代や高速代など入力するタブは？」）
             ★入れる 所は 前から 在りました★。ただ 下の 札を 開かないと 出て こない。
             ⇒ ★表の すぐ下に 道順を 書く★＝探さなくて よい。 -->
          <div class="note" id="jippiNote">
            <b>実費（<span id="jippiNa">会社設定の 名前</span>）</b>と
            <b>電子決済で 受け取った 分</b>は、下の 帯の <b>「入力」</b>で 日ごとに 入れられます。
          </div>
          <div id="list"></div>
          <div class="note">
            件数・実車距離・総走行距離は<b>メーターが確定した数字</b>です（ここでは変えられません）。<br />
            <b>売上＝メーターの合計から、上で選んだ実費を引いた分</b>です。<br />
            実費は<b>手で入力</b>します（名前は 会社設定 →
            実費）。車名をタップすると名前を付けられます。
          </div>
        </div>
      </details>
    </div>

    <script src="js/dk-config.js"></script>
    <!-- ★テスト環境の帯★ 名札(DKConfig.ENV)だけで 決まる。本番では 何も出ない。 -->
    <script src="js/dk-env-badge.js" data-modoru="office"></script>
    <script src="js/dk-session.js"></script>
    <!-- ★画面に出す車の名前を1箇所で決める (2026-08-04)★ 名前が無い時にUUIDを出さない -->
    <script src="js/car-name.js"></script>
    <!-- ★★実費の 読み書きの 決まりは 1か所★★ 2026-09-07（入力画面と 同じ 物を 使う） -->
    <script src="js/jippi-hozon.js"></script>
    <script src="js/uriage-agg.js"></script>
    <script src="js/daiko-payroll.js"></script>
    <!-- ★会社の 締め日（KaishaKikan）も この 1本★ 2026-10-24 -->
    <script src="js/payroll-period.js"></script>
    <script src="js/payroll-daily.js"></script>
    <!-- ★紙（A4のPDF）★ 2026-09-25 … vendor は 押した時だけ 読む（js/kami-pdf.js の中）
         ★本体より 前に 読む★ 2026-10-05：開いた 時に 紙を 描くので、後ろに 置くと 読み終わる 前に 描いて 落ちた -->
    <script src="js/kami-kumu.js"></script>
    <script src="js/kami-hyou.js"></script>
    <script src="js/kami-pdf.js"></script>
    <script>
      (function () {
        'use strict';

        // ★管理画面の中に入っている時は、上のリンク列を出さない（1つのアプリに見せる）★
        //   単体URLで開いた時は今まで通り出る。
        try {
          if (window.self !== window.top) document.body.classList.add('embedded');
        } catch (_) {
          document.body.classList.add('embedded'); // 読めない = 中に入っている
        }

        var SESS = null;
        var COMPANY = null;
        // ★1回の読み込みで「何本 取れなかったか」を覚える箱★
        var LOAD = DKSession.newLoadState();
        // ★★実費の 記録が 読めない 月は 実費の 欄を 打たせない★★ 2026-10-21（入力の 画面と 同じ 穴・対立役が 測った）
        //   前：読みが 失敗すると 手元の 記録が 空＝打つと 高速代・電子決済 などを 0 で 送って 倉庫を 上書きした
        var EDITS_DAME = false;
        var EDITS_DAME_JI =
          '実費の 記録が 読めません。売上と 紙は 止めています（今 打つと 前に 入れた 額が 消える ので 実費も 打てません）。上の「もう一度読む」を 押してください。';
        var MD_DAME = false; // 手で 入れた 日（dk_manual_days）が 読めない 月
        var YOMICHU = false; // 読み込み中（実費を 書かない）
        // ★★この 月の 読みが 通ったか＝表・欄・保存の 門は これ 1つ★★ 2026-10-21（対立役 3回目 止め-2：
        //   読み始めに 止めの 印を 下ろした ので、読みが 失敗した 後や 読み込み中に 車ごと／日ごとを 押すと 前の 月の 記録で
        //   表（引く 前の 額）と 押せる 欄が 出て、橋代を 打つと 高速代・電子決済を 0 で 送った）
        function tsukiYometa() {
          return (
            KAMI_TSUKI === ymKey(MONTH) &&
            !YOMICHU &&
            !EDITS_DAME &&
            !MD_DAME &&
            !(KAISHA && KAISHA.dame) // 会社の 締め日が 読めない 月は 書かない 2026-10-24
          );
        }
        // ★書けた 後に 訳を 消すのは 今の 月が 読めて いる 時だけ★ 2026-10-23（送っている 途中に 月を 替えて

        // ============================================================

        var KAMI_SHU = 'uri';

          //   （今は テスト・本番とも 0人＝害は 0）。dk_ の 表だけ（請求の 表 meisai 等には 足さない）
          function kaishaDake(p) {

            (function shiftsZenbu() {

                    return tsugi(from + 1000);
                  });
              }
              return tsugi(0);
            })(),
            // 実費は 読めたかを 別に 数える（読めない 時は 欄を 押せなく する）
            DKSession.softList(SESS, kaishaDake('dk_shift_edits?select=*&limit=2000'), edYomi),
            soft('dk_device_labels?select=*&limit=500'),
            // res[3]＝dk_sales_settings：★会社の 締め日（kaisha_shime_hi）だけ★ 読む 2026-10-24 件K
            //   引く 物の 列（deduct_*）は 件J（2026-10-24）で 見ない＝入れた 実費は 全部 引く
            //   読めたかは 別に 数える（読めない 締め日を 末日に 倒さない）
            DKSession.softList(SESS, kaishaDake('dk_sales_settings?select=*&limit=1'), ksYomi),
            // ★★実費の 名前（会社が 決めた 一覧）★★ 2026-09-06（司さん「自由に 足せる ように」）
            soft('dk_expense_kinds?select=*&order=sort_order.asc&limit=200'),
            // 手で 入れた 日も 読めたかを 別に 数える（読めない 月は 紙・表を 止める・対立役 D-2：その 車の 売上が 抜けた 額で 出た）
            DKSession.softList(SESS, kaishaDake('dk_manual_days?select=*&limit=2000'), mdYomi),
            // ★売上から 引く 物の 変えた 記録（dk_uriage_rireki）も 2026-10-24 件J で 読まなくした（res[6] は 無い）
          ])
            .then(function (res) {
              if (no !== LOAD_NO) return; // ★古い 読みの 返事は 捨てる★
              YOMICHU = false;
              var st0 = Array.isArray(res[3]) && res[3].length ? res[3][0] : null;
              // ★会社の 締め日★（読めなかった＝通信も 列が 無いも 止める・末日に 倒さない）
              KAISHA =
                ksYomi.failed > 0
                  ? { dame: true, riyuu: '会社の 締め日を 読めませんでした（通信）' }
                  : KaishaKikan.yomu(st0);
              // ★最初に 開いた 時は 今日の 月★（20日締めで 10/24 ⇒ 11月）
              if (!TSUKI_ERANDA && !KAISHA.dame) {
                TSUKI_ERANDA = true;
                var kyouT = KaishaKikan.kyou(KAISHA.hi);
                if (kyouT.year !== MONTH.getFullYear() || kyouT.month !== MONTH.getMonth() + 1) {
                  MONTH = new Date(kyouT.year, kyouT.month - 1, 1);
                  render();
                  return load();
                }
              }
              // ★その 月の 期間の 日の 業務だけ★（広く 読んだ 分を 落とす）
              RAW.shifts = (Array.isArray(res[0]) ? res[0] : []).filter(function (sh) {
                return sh && tsukiNaka(PayrollDaily.dateOf(sh.started_at) || '');
              });
              RAW.edits = Array.isArray(res[1]) ? res[1] : [];
              RAW.labels = Array.isArray(res[2]) ? res[2] : [];
              // ★★実費の 名前★★ 2026-09-06（司さん「自由に 足せる ように」）
              //   ★使う 印が 付いている 物だけ★／★取れなければ 今まで通りの 3つ★
              RAW.kindsZenbu = Array.isArray(res[4]) && res[4].length ? res[4] : null;
              RAW.kinds = (Array.isArray(res[4]) ? res[4] : []).filter(function (k) {
                return k && k.active !== false;
              });
              if (!RAW.kinds.length) {
                RAW.kinds = [
                  { kind_id: 'toll', label: '高速代', sort_order: 10 },
                  { kind_id: 'bridge', label: '橋代', sort_order: 20 },
                  { kind_id: 'other', label: 'その他', sort_order: 30 },
                ];
              }
              // ★手で入れた1日分も同じ数字で出す（給料・月次集計と食い違わないように）★
              //   メーターの記録がある車は出さない＝二重計上しない。
              var manual = (Array.isArray(res[5]) ? res[5] : []).filter(function (m) {
                if (!m || !m.work_date) return false;
                var inMonth = tsukiNaka(String(m.work_date).slice(0, 10)); // ★会社の 期間★
                if (!inMonth) return false;
                return !RAW.shifts.some(function (sh) {
                  return (
                    // ★使わない 印の 業務は 「その日 走った」に 数えない★（数えると 同じ日の 手入力が 消える）
                    sh.excluded !== true &&
                    sh.device_id === m.device_id &&
                    // ★日本時間の 日で 比べる★ 2026-10-05（対立役）＝給料（PayrollDaily.dateOf）と 同じ 切り方
                    //   前は UTC の 日付＝日本時間 0〜9時に 始まった 業務と 同じ日の 手入力が 二重に 足された
                    PayrollDaily.dateOf(sh.started_at) === String(m.work_date).slice(0, 10)
                  );
                });
              });
              var conv = PayrollDaily.manualAsShifts(manual);
              RAW.shifts = RAW.shifts.concat(conv.shifts);
              RAW.edits = RAW.edits.concat(conv.edits);
              ld.tried += edYomi.tried + mdYomi.tried + ksYomi.tried;
              ld.failed += edYomi.failed + mdYomi.failed + ksYomi.failed;
              ED_YOMI = edYomi;
              EDITS_DAME = edYomi.failed > 0;
              MD_DAME = mdYomi.failed > 0;
              KAMI_TSUKI = tsuki;
              window.__editsById = {};
              RAW.edits.forEach(function (e) {
                if (e && e.shift_id) window.__editsById[e.shift_id] = e;
              });
              recalc();
              hikiNaNuru();
              render();
              afterLoad(load); // ★取れなかった物があれば 画面の上に出す★
            })
            .catch(function () {
              if (no !== LOAD_NO) return;
              YOMICHU = false;
              // この 月の 読みは 通って いない（計算が 後半で 転んでも 0円の 紙・表を 出さない・対立役 4回目 直す-1）
              KAMI_TSUKI = '';
              // 前の 月の 止めの 訳を 出さない（「開き直して」で なく 読み込みの 失敗を 出す・対立役 4回目 P3）
              URIAGE_DAME = 0;
              // 描いた 後に 転んだ 時も 数字と 紙の 絵を 失敗の 訳と 並べて 残さない（対立役 5回目 P7）
              if ($('list')) $('list').innerHTML = '';
              if ($('kamiMado')) $('kamiMado').innerHTML = '';
              RAW.shifts = [];
              RAW.edits = [];
              window.__editsById = {};
              ROWS = [];
              DAYS = [];
              showMsg('');
              showErr('読み込みに失敗しました。通信を確認してください。');
              kamiMsg(
                '読み込みに 失敗したので 紙は 出せません（上の「もう一度読む」を 押してください）'
              );
              ld.tried++;
              ld.failed++;
              afterLoad(load);
            });
        }

        // 手元のデータから集計し直す（通信し直さない）
        function recalc() {
          var edits = Object.keys(window.__editsById || {}).map(function (k) {
            return window.__editsById[k];
          });
          // ★車ごと／日ごと の両方を作る（数字は同じ物から作る＝食い違わない）★
          //   引く 額＝入れた 実費 全部（UriageAgg.deductOf）2026-10-24 件J
          // ★会社の 締め日が 読めない＝数字を 作らない★ 2026-10-24（末日に 倒さない）
          if (KAISHA && KAISHA.dame) {
            ROWS = [];
            DAYS = [];
            URIAGE_DAME = 0;
            showErr('');
            return;
          }
          ROWS = UriageAgg.byDevice(RAW.shifts, edits, RAW.labels);
          DAYS = UriageAgg.byDay(RAW.shifts, edits, RAW.labels);
          // 売上の 直しが 読めない 業務が 在れば 知らせる（合計に その 業務は 入っていない）2026-10-14
          var dame = UriageAgg.total(ROWS).uriage_dame;
          URIAGE_DAME = dame;
          if (dame)
            showErr(
              '売上の 直しが 読めない 業務が ' +
                dame +
                '件 あります（合計に 入っていません）。下の 帯の「入力」で その 日の 車を 開いて 直してください。'
            );
        }

        // ---------- 売上から引くもの（名前を 並べる だけ）----------
        //   ★入れた 実費は 全部 引く★ 2026-10-24 件J（選ぶ チェック・何日から・記録は 消した）
        // その 月に 入っている 額（消した 物でも 額が 在れば 隠さない＝隠れたまま 引かれる 事を 作らない・対立役 指3）
        function tsukiGaku(k) {
          var by = window.__editsById || {};
          var g = 0;
          (RAW.shifts || []).forEach(function (s) {
            g += JippiHozon.ima(by[s.shift_id], k) || 0;
          });
          return g;
        }
        // ★出す 物の 決まりは js/jippi-hozon.js mieruKinds の 1か所★（月次集計の 紙・画面と 同じ）
        var MIETA = {}; // この 画面で 一度 出した 打つ 欄（0 を 打っても 消さない）
        function mieruNo(o) {
          return JippiHozon.mieruKinds(RAW.kindsZenbu, tsukiGaku, o);
        }
        // 1回の 業務で 打てる 実費＝[{kind_id, label}]（「使う」を 外した 物は 出さない＝入力の 画面と 同じ）
        function uteruKinds() {
          var l = mieruNo({ nyuryoku: true, mieta: MIETA });
          l.forEach(function (x) {
            MIETA[x.kind_id] = 1;
          });
          return l;
        }
        function hikiNaNuru() {
          $('dHiku').textContent =
            mieruNo({ mieta: MIETA })
              .map(function (x) {
                return x.label || '';
              })
              .join('・') || 'なし';
          if ($('jippiNa'))
            $('jippiNa').textContent =
              uteruKinds()
                .map(function (x) {
                  return x.label;
                })
                .join('・') || '会社設定で 決めた 物';
        }

        // ---------- 描画 ----------
        //   ★司さん「全体的に表が見にくいから他のアプリの用に見せるようにしろ」(2026-08-09)★
        //     7列の表はスマホで横に流れて読めなかった。
        //     1行＝名前(または日付) ＋ 売上を大きく ＋ バー ＋ 小さい字で内訳。
        //   ★司さん「売上を１日おきと車おきで見れないかん」★ → 上の切り替えで出し分ける。
        function money(v) {
          return '¥' + Number(v || 0).toLocaleString();
        }

        function dayLabel(ymd) {
          var p = String(ymd).split('-');
          var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
          var w = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
          return Number(p[1]) + '/' + Number(p[2]) + '（' + w + '）';
        }

        function subText(r) {
          return (
            r.trip_count +
            '件　実車 ' +
            UriageAgg.km(r.actual_total_m) +
            ' km　総走行 ' +
            UriageAgg.km(r.total_distance_m) +
            ' km' +
            (r.deduct_yen ? '　引いた分 −' + money(r.deduct_yen) : '')
          );
        }

        // 1件ぶんの明細（開いた時に出す・高速代などはここで直す）
        function shiftLine(s) {
          var e = (window.__editsById || {})[s.shift_id] || {};
          var d = new Date(s.started_at);
          return (
            '<div class="dline">' +
            '<div class="dtop"><span>' +
            (d.getMonth() + 1) +
            '/' +
            d.getDate() +
            '</span><span>' +
            (function () {
              // 売上＝事務所が 直した 額 か メーター（UriageAgg.uriageOf の 1か所）2026-10-14
              var u = UriageAgg.uriageOf(s, e);
              if (u === null) return '読めません';
              var naoshi = e.uriage_yen !== null && e.uriage_yen !== undefined;
              return (
                money(u) + (naoshi ? '（直した・メーター ' + money(s.fare_total_yen) + '）' : '')
              );
            })() +
            '</span></div>' +
            '<div class="dsub">' +
            (function () {
              // 回数・距離＝事務所が 直した 数 か メーター（UriageAgg.kazuOf の 1か所）2026-10-25
              var kz = UriageAgg.kazuOf(s, e);
              return (
                kz.trip_count +
                '件　実車 ' +
                UriageAgg.km(kz.actual_total_m) +
                ' km　総走行 ' +
                UriageAgg.km(kz.total_distance_m) +
                ' km' +
                (kz.naoshi ? '（直した）' : '')
              );
            })() +
            '</div>' +
            '<div class="dedit">' +
            (s.isManual
              ? '手で入れた分（下の 帯の「入力」で その 日の 車を 開いて 直せます）'
              : // ★欄は 会社設定の 実費の 一覧★ 2026-10-20（前は「高速・橋・その他」固定＝司さん「経費に設定しとんのに」）
                uteruKinds()
                  .map(function (k) {
                    return (
                      esc(k.label) +
                      ' <input class="yen" data-sid="' +
                      esc(s.shift_id) +
                      '" data-f="' +
                      esc(k.kind_id) +
                      '" value="' +
                      (JippiHozon.ima(e, k.kind_id) || 0) +
                      '">'
                    );
                  })
                  .join(' ')) +
            '</div>' +
            '</div>'
          );
        }

        // 車1台ぶんの小さい行（日ごとを開いた時に出す）
        function carLine(c) {
          return (
            '<div class="dline">' +
            '<div class="dtop"><span>' +
            esc(c.label) +
            '</span><span>' +
            money(c.net_fare_yen) +
            '</span></div>' +
            '<div class="dsub">' +
            subText(c) +
            '</div>' +
            '</div>'
          );
        }

        // ★★紙の 表を 作る★★ 2026-09-05（司さん）
        //   車ごと … 車／売上／実費／回数／実車距離／総走行距離（6列）
        //   日ごと … 日／売上／回数／実車距離／総走行距離（5列）
        //   ★数字は 札と 同じ 物を 使う★＝画面の 中で 食い違わない
        function rowHtml(o) {
          // バーは「一番多い所を100%」で見る（額の大小が一目で分かる）
          var pct = o.max > 0 ? Math.max(2, Math.round((o.value / o.max) * 100)) : 0;
          return (
            '<div class="row">' +
            '<div class="rhead"><div class="rname">' +
            o.name +
            '</div><div class="ramt">' +
            money(o.value) +
            '</div></div>' +
            '<div class="rbar"><span style="width:' +
            pct +
            '%"></span></div>' +
            '<div class="rsub">' +
            o.sub +
            '</div>' +
            '<button class="rmore" type="button" data-key="' +
            esc(o.key) +
            '">' +
            (o.open ? '閉じる ▴' : o.openText) +
            '</button>' +
            (o.open ? '<div class="rdetail">' + o.detail + '</div>' : '') +
            '</div>'
          );
        }

        function render() {
          $('monthLabel').textContent = ymLabel(MONTH);
          $('segCar').className = 'segb' + (MODE === 'car' ? ' on' : '');
          $('segDay').className = 'segb' + (MODE === 'day' ? ' on' : '');

          var list = $('list');

          // ★★入力（打つ 所）は ここに 在りません★★ 2026-09-07
          //   ★司さん★「フッターに作れってこやろがぼけ」
          //   ⇒ ★下の 帯の「入力」（nyuryoku.html）★へ 出しました。
          //   ここ（売上表）は ★見る 所★＝車ごと／日ごと の 2つだけ。

          // ★紙が 描けなくても 表・設定は 動かす★（対立役 10-05：投げると 読み込みの catch に 吸われ「通信を確認」と 出て 全部 止まった）
          try {
            kamiMiseru();
          } catch (e) {
            kamiMsg('紙を 出せません：' + (e && e.message ? e.message : e));
          }
          var rows = MODE === 'day' ? DAYS : ROWS;
          // ★実費が 読めない 月も 数字を 出さない★ 2026-10-21（対立役 U-1：表の 合計が 引く 前の ¥40,000 で 出た）
          if (EDITS_DAME || MD_DAME) {
            list.innerHTML = '';
            showMsg('');
            showErr(EDITS_DAME ? EDITS_DAME_JI : MD_DAME_JI);
            return;
          }
          // この 月の 読みが 通る まで 表を 出さない（読み込み中・読みが 失敗した 後）
          if (!tsukiYometa()) {
            list.innerHTML = '';
            if (YOMICHU) showMsg('読み込み中…');
            return;
          }
          if (!rows.length) {
            list.innerHTML = '';
            showMsg('この月はまだ記録がありません。');
            return;
          }
          showMsg('');

          var max = 0;
          rows.forEach(function (r) {
            if (r.net_fare_yen > max) max = r.net_fare_yen;
          });

          var html = '';
          rows.forEach(function (r) {
            if (MODE === 'day') {
              html += rowHtml({
                key: r.date,
                name: dayLabel(r.date),
                value: r.net_fare_yen,
                max: max,
                sub: subText(r),
                open: !!OPEN[r.date],
                openText: '車ごと ▾',
                detail: r.cars.map(carLine).join(''),
              });
            } else {
              html += rowHtml({
                key: r.device_id,
                name:
                  '<input class="carname" data-dev="' +
                  esc(r.device_id) +
                  '" value="' +
                  esc(r.label) +
                  '" placeholder="車の名前">',
                value: r.net_fare_yen,
                max: max,
                sub: subText(r),
                open: !!OPEN[r.device_id],
                // ★★中に 何が 在るか 名前に 書く★★ 2026-09-06（司さん「橋代や高速代など入力するタブは？」）
                //   ★入れる 所は 前から 在りました★。ただ ★『日ごと ▾』の 中に 隠れていて 見つからない★。
                //   ⇒ ★名前に 何が 出来るかを 書く★＝開かなくても 分かる。
                openText: '日ごと ▾（実費を 入れる）',
                detail: r.shifts.map(shiftLine).join(''),
              });
            }
          });

          var t = UriageAgg.total(rows);
          html +=
            '<div class="row totalrow">' +
            '<div class="rhead"><div class="rname">合計</div><div class="ramt">' +
            money(t.net_fare_yen) +
            '</div></div>' +
            '<div class="rsub">' +
            subText(t) +
            '</div>' +
            '</div>';

          list.innerHTML = html;
          wire();
        }

        function wire() {
          Array.prototype.forEach.call(document.querySelectorAll('.rmore'), function (b) {
            b.onclick = function () {
              var k = b.getAttribute('data-key');
              OPEN[k] = !OPEN[k];
              render();
            };
          });
          Array.prototype.forEach.call(document.querySelectorAll('.carname'), function (i) {
            i.onchange = function () {
              saveLabel(i.getAttribute('data-dev'), i.value);
            };
          });
          bindYen();
        }

        // ★実費の 欄を 繋ぐ★（★2か所から 呼ぶので 1つに 出した★ 2026-09-06）
        //   ・車の札を 開いた 時（前から 在る 道）
        //   ・★入力タブ★（司さん「入力するなら入力タブつくれよ」）
        //   ★保存の 決まりを 2か所に 書かない★＝片方だけ 直って 食い違うのを 防ぐ
        function bindYen() {
          Array.prototype.forEach.call(document.querySelectorAll('.yen'), function (i) {
            i.onchange = function () {
              saveEdit(i.getAttribute('data-sid'), i.getAttribute('data-f'), i.value);
            };
            if (!tsukiYometa()) i.disabled = true;
          });
          if (EDITS_DAME && document.querySelector('.yen')) showErr(EDITS_DAME_JI);
        }

        // ---------- 保存（手入力ぶん・元データは触らない） ----------
        function saveLabel(deviceId, label) {
          if (!COMPANY) return;
          DKSession.rest(SESS, 'dk_device_labels?on_conflict=company_id,device_id', {
            method: 'POST',
            headers: { Prefer: 'resolution=merge-duplicates' },
            body: JSON.stringify({
              company_id: COMPANY.company_id,
              device_id: deviceId,
              label: label,
              updated_at: new Date().toISOString(),
            }),
          })
            .then(function (r) {
              if (!r.ok) saveErr('車の名前を保存できませんでした。', r);
              else kakiOkErrKesu();
            })
            .catch(function () {
              showErr('車の名前を保存できませんでした。');
            });
        }

        // ★★実費の 読み書きの 決まりは js/jippi-hozon.js の 1か所★★ 2026-09-07
        //   ★司さん★「フッターに作れってこやろがぼけ」で 入力画面が 別に できた。
        //   ⇒ ★同じ 決まりを 2か所に 書かない★（片方だけ 直って 食い違うのを 防ぐ）
        //   ★古い 3つ（toll/bridge/other）は 列／足した 物は expenses★ も その中。
        function jippiIma(e, kindId) {
          return JippiHozon.ima(e, kindId);
        }
        function jippiGoukei(e, kinds, hiku) {
          return JippiHozon.goukei(e, kinds, hiku);
        }

        // ★保存の 決まりは js/jippi-hozon.js の 1か所★（ここは 呼ぶだけ）
        function saveEdit(shiftId, field, value) {
          if (!COMPANY) return;
          if (!tsukiYometa()) {
            showErr(
              YOMICHU
                ? '読み込み中です。読み終えてから もう一度 入れてください。'
                : EDITS_DAME
                  ? EDITS_DAME_JI
                  : 'この 月の 記録を 読めていないので 保存しません。上の「もう一度読む」を 押してください。'
            );
            return;
          }
          // ★読めない 字は 送らない★ 2026-10-30（入力の 画面と 同じ 読み方＝JippiHozon.yomuEn）
          //   前は 崩れた 字（1-2・1.5）を seisuu で 黙って 1円 等に して 保存した。「1,000」は 1000
          if (JippiHozon.yomuEn(value) === undefined) {
            showErr('金額は 0以上の 整数で 入れてください（空＝0）。保存していません。');
            return;
          }
          var cur = (window.__editsById || {})[shiftId] || {};
          JippiHozon.saveJippi(SESS, shiftId, COMPANY.company_id, cur, field, value)
            .then(function (body) {
              kakiOkErrKesu();
              window.__editsById[shiftId] = body;
              recalc(); // 売上（差引後）と合計に即反映
              render();
              hikiNaNuru(); // 額で 出す 物が 変わる（対立役 2回目 指3）
            })
            .catch(function () {
              showErr('保存できませんでした。通信を確認してください。');
            });
        }
      })();
    </script>
