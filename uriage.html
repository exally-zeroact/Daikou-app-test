<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ダイコメ 売上表</title>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>"
    />
    <style>
      :root {
        --blue: #007aff;
        --blue-d: #0a5fd0;
        --ink: #14243d;
        --muted: #5a6b82;
        --bg: #f2f7ff;
        --line: #dbe7f7;
        --danger: #e0483d;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 22px 18px 60px;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;

        /* ★狭い画面では 名前と行き先ボタンを 上下に分ける（押し合って字が割れない）★ 2026-08-25 */
        flex-wrap: wrap;
        gap: 4px 12px;
      }

      .logo {
        font-weight: 800;

        /* ★詰めた★ 2026-09-05（20px→17px・他のアプリと 同じ 並び） */
        font-size: 17px;
        color: var(--blue-d);
      }

      .top .tag {
        font-size: 12px;
        font-weight: 700;
        color: #fff;
        background: var(--blue);
        border-radius: 999px;
        padding: 2px 10px;
        margin-left: 8px;

        /* ★狭い画面で「給料」の2文字が 縦に割れていた★（2026-08-25 実測 375px … 110 x 51＝2行）
           札の字は 折り返さない。 */
        white-space: nowrap;
      }

      .sub {
        color: var(--muted);
        font-size: 13px;

        /* ★詰めた★ 2026-09-05（16px→8px） */
        margin-bottom: 8px;
      }

      .linkbtn {
        background: none;
        border: none;
        color: var(--blue);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        padding: 4px 2px;
      }

      /* 管理画面の中に出している時は、その画面の上のリンク列を隠す */
      body.embedded .top,
      body.embedded .sub {
        display: none;
      }

      body.embedded .wrap {
        padding-top: 8px;
      }

      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;

        /* ★詰めた★ 2026-09-05（司さん「デカすぎる」）16px→12px / 14px→10px */
        padding: 12px;
        margin-bottom: 10px;
      }

      /* ★★日付を 左右の ボタンで 挟む★★ 2026-09-05（司さん「挟む 形に したら スッキリ」）
         ★前は flex-wrap: wrap★ だったので、日付の 字が 長い（実測 328px）と
         ★折り返して 日付が 上・ボタンが 下★の 2段に なっていました。
         ⇒ ★折り返さない★＝ボタンは 左右に 固定、日付は 真ん中で 縮む。 */
      .monthbar {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: space-between;
        flex-wrap: nowrap;
      }

      .monthbar .m {
        font-size: 18px;
        font-weight: 800;
        flex: 1 1 auto; /* ★真ん中で 縮む★ 2026-09-05 */
        min-width: 0;
        text-align: center;
        overflow-wrap: anywhere;
      }

      /* ★狭い画面で 押す物の字が1文字ずつ縦に割れる★（2026-08-25 実測・375px）
           給料 「‹ 前の月」 45 x 102（＝4行に割れていた）
           売上表 62 x 58 ／ 月次集計 72 x 58（＝2行）  ※1行なら 約34px
         原因：真ん中の「月の字」の箱が min-width で場所を先に取り、
               押す物だけが縮められていた（flex は 押す物から縮める）。
         直し方：月(年)の字を 上の行へ落として、押す物は 横1行で並べる。
                 ★480px より広い画面は 今まで通り（1文字も変えない）★ */

      /* ★★狭い画面でも 挟む形の まま★★ 2026-09-05（司さん「挟む 形に したら スッキリ」）
         ★前は ここで 日付を order:-1 で 上の 段へ 追い出していました★
         ⇒ 日付が 上・ボタンが 下の 2段（実測 日付 top=144 / ボタン top=179）
         ⇒ ★1段に 収める★＝日付の 字だけ 少し 小さくして 左右の ボタンで 挟む */
      @media (max-width: 480px) {
        .monthbar .m {
          font-size: 15px;
        }

        .navb {
          padding: 6px 10px;
        }
      }

      .navb {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 6px 14px;
        font-size: 15px;
        font-weight: 700;
        color: var(--blue-d);
        cursor: pointer;
        white-space: nowrap; /* ★1文字ずつ縦に割れない★ */ /* ★押す物は縮めない★ */

        /* ★挟む形★ 左右の ボタンは 縮まない（2026-09-05） */
        flex: 0 0 auto;
      }

      /* ===== 読める一覧＋バー (2026-08-09) =====
         司さん「全体的に表が見にくいから他のアプリの用に見せるようにしろ」
         7列の表はスマホで横に流れて読めなかった。1行を大きく、金額を主役にする。 */
      .seg {
        display: flex;
        gap: 6px;
        background: #e8f0fe;
        padding: 4px;
        border-radius: 12px;
      }

      .segb {
        flex: 1;
        border: none;
        background: none;
        border-radius: 9px;
        padding: 9px 6px;
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        color: var(--blue-d);
        cursor: pointer;
      }

      .segb.on {
        background: var(--blue-d);
        color: #fff;
      }

      .row {
        border-bottom: 1px solid var(--line);
        padding: 12px 2px 11px;
      }

      .row:last-child {
        border-bottom: none;
      }

      .rhead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .rname {
        font-size: 16px;
        font-weight: 800;
        color: var(--ink);
        min-width: 0;
      }

      .ramt {
        font-size: 19px;
        font-weight: 800;
        color: var(--blue-d);
        white-space: nowrap;
      }

      .rbar {
        height: 7px;
        background: #e8f0fe;
        border-radius: 4px;
        margin: 7px 0 6px;
        overflow: hidden;
      }

      .rbar span {
        display: block;
        height: 100%;
        background: var(--blue);
        border-radius: 4px;
      }

      .rsub {
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.7;
      }

      .rmore {
        margin-top: 6px;
        background: none;
        border: none;
        padding: 4px 0;
        font-size: 13px;
        font-weight: 700;
        font-family: inherit;
        color: var(--blue);
        cursor: pointer;
      }

      .rdetail {
        margin-top: 8px;
        border-left: 3px solid var(--line);
        padding-left: 10px;
      }

      .dline {
        padding: 8px 0;
        border-bottom: 1px dashed var(--line);
      }

      .dline:last-child {
        border-bottom: none;
      }

      .dtop {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
      }

      .dsub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }

      .dedit {
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .totalrow {
        margin-top: 4px;
        border-top: 2px solid var(--line);
        padding-top: 12px;
      }

      .totalrow .rname,
      .totalrow .ramt {
        font-size: 20px;
      }

      .carname {
        font-weight: 700;
        color: var(--blue-d);
        background: none;
        border: none;
        border-bottom: 1px dashed var(--line);
        font-size: 14px;
        font-family: inherit;
        width: 8em;
        padding: 2px 0;
      }

      .carname:focus {
        outline: none;
        border-bottom-color: var(--blue);
      }

      .scroller {
        overflow-x: auto;
      }

      .expander {
        cursor: pointer;
        color: var(--blue);
        font-size: 12px;
        font-weight: 700;
        background: none;
        border: none;
        padding: 2px 6px;
      }

      .yen {
        width: 6.5em;
        text-align: right;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 6px;
        font-size: 13px;
        font-family: inherit;
      }

      .yen:focus {
        outline: none;
        border-color: var(--blue);
      }

      .msg {
        text-align: center;
        color: var(--muted);
        padding: 26px 10px;
        font-size: 14px;
      }

      .err {
        color: var(--danger);
        font-size: 13px;
        margin-top: 8px;
      }

      .saved {
        color: #1a8a4a;
        font-size: 12px;
        font-weight: 700;
      }

      .note {
        font-size: 12px;
        color: var(--muted);
        margin-top: 10px;
      }

      .setrow {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 14px;
      }

      .setlabel {
        font-weight: 700;
        color: var(--muted);
        font-size: 13px;
      }

      .chk {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        font-weight: 700;
      }

      .chk input {
        width: 17px;
        height: 17px;
        accent-color: var(--blue);
      }

      /* ★★紙の 表★★ 2026-09-05（司さん「紙にして スクロールせんでええようにしろ」）
         ★司さんの 代行計算表2026.xlsb「売上表」と 同じ 罫線の 表★
         ★横に すべらせない★＝列の 幅を 決める（table-layout: fixed）
           6列なら 1列 57px＝「1,298,210」（11pxで 56px）が 1行で 入る */
      .kami-ttl {
        font-weight: 800;
        margin: 10px 0 4px;
        border-left: 4px solid var(--blue);
        padding-left: 7px;
      }

      table.kami {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      table.kami > thead > tr > th,
      table.kami > tbody > tr > td {
        border: 1px solid #b9c6d8;
        padding: 3px 2px;
        text-align: right;
        white-space: nowrap;
        line-height: 1.3;
      }

      table.kami > thead > tr > th {
        background: #eef3fa;
        color: var(--ink);
        font-weight: 700;
        text-align: center;
        font-size: 10px;
        line-height: 1.25;
        white-space: normal;
      }

      table.kami > thead > tr > th:first-child,
      table.kami > tbody > tr > td:first-child {
        text-align: left;
      }

      table.kami > tbody > tr.sum > td {
        font-weight: 800;
        background: #f7fbff;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div><span class="logo">ダイコメ</span><span class="tag">売上表</span></div>
        <div>
          <button class="linkbtn" id="btnLogout">ログアウト</button>
        </div>
      </div>
      <div class="sub" id="sub">読み込み中…</div>

      <!-- ★★操作は 1つの 箱に まとめる★★ 2026-09-05（司さん「デカすぎ・バランス悪すぎ」）
           ★前は 月えらび／引くもの／車ごと・日ごと が ★3つの 箱に 分かれて★ いました。
           ★実測★ 数字の 1行目まで ★447px＝1画面の 53%★＝★半分が 上の 塊★
           ⇒ 1つに まとめる。★中身は 1つも 減らしていません／押す 回数も 同じ★ -->
      <div class="card">
        <div class="monthbar">
          <button class="navb" id="prevM">‹ 前の月</button>
          <div class="m" id="monthLabel">—</div>
          <button class="navb" id="nextM">次の月 ›</button>
        </div>
        <div class="setrow" style="margin-top: 10px">
          <span class="setlabel">売上から引くもの</span>
          <label class="chk"><input type="checkbox" id="dToll" /> 高速代</label>
          <label class="chk"><input type="checkbox" id="dBridge" /> 橋代</label>
          <label class="chk"><input type="checkbox" id="dOther" /> その他</label>
          <span class="saved" id="setSaved"></span>
        </div>

        <!-- ★車ごと／日ごと の切り替え (2026-08-09 司さん「1日おきと車おきで見れないかん」)★ -->
        <div class="seg" style="margin-top: 10px">
          <button class="segb on" id="segCar" type="button">車ごと</button>
          <button class="segb" id="segDay" type="button">日ごと</button>
        </div>
      </div>

      <div class="card">
        <!-- ★★紙の 表★★ 2026-09-05（司さん「紙にして スクロールせんでええようにしろ」）
             ★司さんの 売上表と 同じ 罫線の 表★を 上に 出す。
             下の 札（押すと 開く）は ★前から 出来ていた 事なので 残します★。 -->
        <!-- ★★紙の 表★★ 2026-09-05（司さん「紙にして スクロールせんでええようにしろ」）
             ★上の「車ごと／日ごと」で 切り替わります★（ボタンで 分けている 意味を 残す）。 -->
        <div class="kami-ttl" id="kamiTtl">車ごと</div>
        <table class="kami" id="kamiTbl">
          <thead id="kamiHead"></thead>
          <tbody id="kamiBody"></tbody>
        </table>
        <div id="list"></div>
        <div class="msg" id="msg" style="display: none"></div>
        <div class="err" id="err" style="display: none"></div>
        <div class="note">
          件数・実車距離・総走行距離は<b>メーターが確定した数字</b>です（ここでは変えられません）。<br />
          <b>売上＝メーターの合計から、上で選んだ実費を引いた分</b>です。<br />
          高速代・橋代などは<b>手で入力</b>します。車名をタップすると名前を付けられます。
        </div>
      </div>
    </div>

    <script src="js/dk-config.js"></script>
    <!-- ★テスト環境の帯★ 名札(DKConfig.ENV)だけで 決まる。本番では 何も出ない。 -->
    <script src="js/dk-env-badge.js" data-modoru="office"></script>
    <script src="js/dk-session.js"></script>
    <!-- ★画面に出す車の名前を1箇所で決める (2026-08-04)★ 名前が無い時にUUIDを出さない -->
    <script src="js/car-name.js"></script>
    <script src="js/uriage-agg.js"></script>
    <script src="js/daiko-payroll.js"></script>
    <script src="js/payroll-period.js"></script>
    <script src="js/payroll-daily.js"></script>
    <script>
      (function () {
        'use strict';

        // ★管理画面の中に入っている時は、上のリンク列を出さない（1つのアプリに見せる）★
        //   単体URLで開いた時は今まで通り出る。
        try {
          if (window.self !== window.top) document.body.classList.add('embedded');
        } catch (_) {
          document.body.classList.add('embedded'); // 読めない = 中に入っている
        }

        var SESS = null;
        var COMPANY = null;
        // ★1回の読み込みで「何本 取れなかったか」を覚える箱★
        var LOAD = DKSession.newLoadState();
        var MONTH = new Date();
        var ROWS = []; // 車ごと
        var DAYS = []; // ★日ごと (2026-08-09 司さん「1日おきと車おきで見れないかん」)★
        var MODE = 'car'; // 'car' = 車ごと / 'day' = 日ごと
        var OPEN = {}; // 開いている行（車ごとは端末ID・日ごとは日付）
        var SETTINGS = null; // 売上から何を引くか（会社ごと）
        var RAW = { shifts: [], edits: [], labels: [] };

        var $ = function (id) {
          return document.getElementById(id);
        };
        function esc(s) {
          return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) {
            return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c];
          });
        }
        function showErr(m) {
          $('err').textContent = m;
          $('err').style.display = m ? 'block' : 'none';
        }
        // ★2026-08-08: 断られた時に「どの会社に書こうとして断られたか」まで出す★
        //   司さんの申告では 赤字が「手で入れた分を保存できませんでした。」だけで、
        //   ★相手の会社が分からないので誰も原因に辿り着けなかった★（実際は検証ゴミの会社だった）。
        //   401/403 は倉庫が「その会社には書けない」と言っている時なので、会社名を添える。
        function saveErr(msg, r) {
          try {
            var st = r && r.status;
            if (st === 401 || st === 403) {
              var nm = (COMPANY && COMPANY.name) || '(会社が選ばれていません)';
              return showErr(msg + ' ' + nm + ' には書き込めません。');
            }
          } catch (_) {
            /* 名前が出せなくても、元の言い方はそのまま出す */
          }
          return showErr(msg);
        }
        function showMsg(m) {
          $('msg').textContent = m;
          $('msg').style.display = m ? 'block' : 'none';
        }

        function ymLabel(d) {
          return d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
        }
        function ymKey(d) {
          return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
        }
        function monthRange(d) {
          var from = new Date(d.getFullYear(), d.getMonth(), 1, 0, 0, 0);
          var to = new Date(d.getFullYear(), d.getMonth() + 1, 1, 0, 0, 0);
          return { from: from.toISOString(), to: to.toISOString() };
        }

        // ---------- 起動 ----------
        DKSession.ensure().then(function (s) {
          if (!s) return DKSession.goLogin();
          SESS = s;
          loadCompany();
        });

        $('btnLogout').onclick = function () {
          DKSession.logout();
        };
        $('prevM').onclick = function () {
          MONTH = new Date(MONTH.getFullYear(), MONTH.getMonth() - 1, 1);
          render();
          load();
        };
        $('nextM').onclick = function () {
          MONTH = new Date(MONTH.getFullYear(), MONTH.getMonth() + 1, 1);
          render();
          load();
        };

        // ★車ごと／日ごと の切り替え★
        //   通信し直さない（同じ数字を見せ方だけ変える）。
        //   開いていた行は閉じる＝車の並びに日付の鍵が残って混ざらないように。
        function setMode(m) {
          if (MODE === m) return;
          MODE = m;
          OPEN = {};
          render();
        }
        $('segCar').onclick = function () {
          setMode('car');
        };
        $('segDay').onclick = function () {
          setMode('day');
        };

        function loadCompany() {
          // ★2026-08-08: 自分の会社だけを、決まった順で取る★
          //   旧: limit=1 ・並び順なしで j[0] を無条件に採用していた。
          //       司さんを dk_admins に入れた結果 11社見えるようになり、
          //       検証ゴミの会社を掴んでいた（給料が保存できない・台数が0）。
          DKSession.myCompanies(SESS, 'company_id,name')
            .then(function (r) {
              // ★自分が誰か分からない時は 会社を一切出さない (2026-08-08)★
              if (r && r.noUid) return 'unknown';
              return r.json();
            })
            .then(function (j) {
              if (!Array.isArray(j) || !j.length) {
                $('sub').textContent = '会社が登録されていません';
                showMsg('先に「会社設定」で会社を登録してください。');
                return;
              }
              if (j === 'unknown') {
                $('sub').textContent = '読み込み中…';
                return;
              }
              // ★黙って先頭を選ばない★（2件以上なら事務所の画面で選んでもらう）
              var picked = DKSession.pickCompany(j, DKSession.rememberedCompanyId());
              if (picked.mode !== 'one') {
                $('sub').textContent = '会社を選んでください';
                showMsg('会社が複数あります。事務所の画面でどの会社を出すか選んでください。');
                return;
              }
              COMPANY = picked.company;
              $('sub').textContent = COMPANY.name || '';
              render();
              load();
            })
            .catch(function () {
              $('sub').textContent = '';
              showErr('会社の読み込みに失敗しました。通信を確認してください。');
            });
        }

        function load() {
          if (!COMPANY) return;
          showErr('');
          showMsg('読み込み中…');
          var r = monthRange(MONTH);
          var q =
            'dk_shifts?select=shift_id,device_id,started_at,total_distance_m,actual_total_m,fare_total_yen,trip_count' +
            '&started_at=gte.' +
            encodeURIComponent(r.from) +
            '&started_at=lt.' +
            encodeURIComponent(r.to) +
            '&order=started_at.asc&limit=2000';

          // ★1つ失敗しても画面を殺さない★
          //   手入力(dk_shift_edits)や車名(dk_device_labels)がまだ無くても、
          //   メーターの数字だけは必ず出す。
          // ★2026-08-09: 取れなかったことを 数える★
          //   旧: 通信が失敗しても黙って空配列 → 画面には 0 と出ていた。
          //   新: 空は返すが ★失敗は必ず数える★。画面の上に出して 数字は「—」にする。
          function soft(path) {
            return DKSession.softList(SESS, path, LOAD);
          }
          function afterLoad(retry) {
            DKSession.showUnknownBar(LOAD, retry);
          }

          Promise.all([
            DKSession.rest(SESS, q).then(function (x) {
              if (!x.ok) throw new Error('shifts');
              return x.json();
            }),
            soft('dk_shift_edits?select=*&limit=2000'),
            soft('dk_device_labels?select=*&limit=500'),
            soft('dk_sales_settings?select=*&limit=1'),
            soft('dk_manual_days?select=*&limit=2000'),
          ])
            .then(function (res) {
              RAW.shifts = Array.isArray(res[0]) ? res[0] : [];
              RAW.edits = Array.isArray(res[1]) ? res[1] : [];
              RAW.labels = Array.isArray(res[2]) ? res[2] : [];
              var st = Array.isArray(res[3]) && res[3].length ? res[3][0] : null;
              // ★手で入れた1日分も同じ数字で出す（給料・月次集計と食い違わないように）★
              //   メーターの記録がある車は出さない＝二重計上しない。
              var manual = (Array.isArray(res[4]) ? res[4] : []).filter(function (m) {
                if (!m || !m.work_date) return false;
                var inMonth = String(m.work_date).slice(0, 7) === ymKey(MONTH);
                if (!inMonth) return false;
                return !RAW.shifts.some(function (sh) {
                  return (
                    sh.device_id === m.device_id &&
                    String(sh.started_at).slice(0, 10) === m.work_date
                  );
                });
              });
              var conv = PayrollDaily.manualAsShifts(manual);
              RAW.shifts = RAW.shifts.concat(conv.shifts);
              RAW.edits = RAW.edits.concat(conv.edits);
              SETTINGS = UriageAgg.normSettings(st);
              window.__editsById = {};
              RAW.edits.forEach(function (e) {
                if (e && e.shift_id) window.__editsById[e.shift_id] = e;
              });
              recalc();
              renderSettings();
              render();
              afterLoad(load); // ★取れなかった物があれば 画面の上に出す★
            })
            .catch(function () {
              showMsg('');
              showErr('読み込みに失敗しました。通信を確認してください。');
            });
        }

        // 手元のデータから集計し直す（通信し直さない）
        function recalc() {
          var edits = Object.keys(window.__editsById || {}).map(function (k) {
            return window.__editsById[k];
          });
          // ★車ごと／日ごと の両方を作る（数字は同じ物から作る＝食い違わない）★
          ROWS = UriageAgg.byDevice(RAW.shifts, edits, RAW.labels, SETTINGS);
          DAYS = UriageAgg.byDay(RAW.shifts, edits, RAW.labels, SETTINGS);
        }

        // ---------- 売上から引くものの設定 ----------
        function renderSettings() {
          var s = SETTINGS || UriageAgg.normSettings(null);
          $('dToll').checked = !!s.deduct_toll;
          $('dBridge').checked = !!s.deduct_bridge;
          $('dOther').checked = !!s.deduct_other;
        }
        ['dToll', 'dBridge', 'dOther'].forEach(function (id) {
          $(id).onchange = function () {
            SETTINGS = {
              deduct_toll: $('dToll').checked,
              deduct_bridge: $('dBridge').checked,
              deduct_other: $('dOther').checked,
            };
            recalc();
            render();
            saveSettings();
          };
        });
        function saveSettings() {
          if (!COMPANY) return;
          DKSession.rest(SESS, 'dk_sales_settings?on_conflict=company_id', {
            method: 'POST',
            headers: { Prefer: 'resolution=merge-duplicates' },
            body: JSON.stringify({
              company_id: COMPANY.company_id,
              deduct_toll: SETTINGS.deduct_toll,
              deduct_bridge: SETTINGS.deduct_bridge,
              deduct_other: SETTINGS.deduct_other,
              updated_at: new Date().toISOString(),
            }),
          })
            .then(function (r) {
              $('setSaved').textContent = r.ok ? '保存しました' : '';
              if (!r.ok) saveErr('設定を保存できませんでした。', r);
              else showErr('');
              setTimeout(function () {
                $('setSaved').textContent = '';
              }, 1600);
            })
            .catch(function () {
              showErr('設定を保存できませんでした。');
            });
        }

        // ---------- 描画 ----------
        //   ★司さん「全体的に表が見にくいから他のアプリの用に見せるようにしろ」(2026-08-09)★
        //     7列の表はスマホで横に流れて読めなかった。
        //     1行＝名前(または日付) ＋ 売上を大きく ＋ バー ＋ 小さい字で内訳。
        //   ★司さん「売上を１日おきと車おきで見れないかん」★ → 上の切り替えで出し分ける。
        function money(v) {
          return '¥' + Number(v || 0).toLocaleString();
        }

        function dayLabel(ymd) {
          var p = String(ymd).split('-');
          var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
          var w = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
          return Number(p[1]) + '/' + Number(p[2]) + '（' + w + '）';
        }

        function subText(r) {
          return (
            r.trip_count +
            '件　実車 ' +
            UriageAgg.km(r.actual_total_m) +
            ' km　総走行 ' +
            UriageAgg.km(r.total_distance_m) +
            ' km' +
            (r.deduct_yen ? '　引いた分 −' + money(r.deduct_yen) : '')
          );
        }

        // 1件ぶんの明細（開いた時に出す・高速代などはここで直す）
        function shiftLine(s) {
          var e = (window.__editsById || {})[s.shift_id] || {};
          var d = new Date(s.started_at);
          return (
            '<div class="dline">' +
            '<div class="dtop"><span>' +
            (d.getMonth() + 1) +
            '/' +
            d.getDate() +
            '</span><span>' +
            money(s.fare_total_yen) +
            '</span></div>' +
            '<div class="dsub">' +
            (s.trip_count || 0) +
            '件　実車 ' +
            UriageAgg.km(s.actual_total_m) +
            ' km　総走行 ' +
            UriageAgg.km(s.total_distance_m) +
            ' km</div>' +
            '<div class="dedit">' +
            (s.isManual
              ? '手で入れた分（給料の画面で直せます）'
              : '高速 <input class="yen" data-sid="' +
                esc(s.shift_id) +
                '" data-f="toll_yen" value="' +
                (e.toll_yen || 0) +
                '"> 橋 <input class="yen" data-sid="' +
                esc(s.shift_id) +
                '" data-f="bridge_yen" value="' +
                (e.bridge_yen || 0) +
                '"> その他 <input class="yen" data-sid="' +
                esc(s.shift_id) +
                '" data-f="other_yen" value="' +
                (e.other_yen || 0) +
                '">') +
            '</div>' +
            '</div>'
          );
        }

        // 車1台ぶんの小さい行（日ごとを開いた時に出す）
        function carLine(c) {
          return (
            '<div class="dline">' +
            '<div class="dtop"><span>' +
            esc(c.label) +
            '</span><span>' +
            money(c.net_fare_yen) +
            '</span></div>' +
            '<div class="dsub">' +
            subText(c) +
            '</div>' +
            '</div>'
          );
        }

        // ★★紙の 表を 作る★★ 2026-09-05（司さん）
        //   車ごと … 車／売上／実費／回数／実車距離／総走行距離（6列）
        //   日ごと … 日／売上／回数／実車距離／総走行距離（5列）
        //   ★数字は 札と 同じ 物を 使う★＝画面の 中で 食い違わない
        function renderKami(rows) {
          var hi = MODE === 'day';
          $('kamiTtl').textContent = hi ? '日ごと' : '車ごと';
          $('kamiHead').innerHTML = hi
            ? '<tr><th>日</th><th>売上</th><th>回数</th><th>実車距離</th><th>総走行距離</th></tr>'
            : '<tr><th>車</th><th>売上</th><th>実費</th><th>回数</th><th>実車距離</th><th>総走行距離</th></tr>';
          var g = { net: 0, deduct: 0, trip: 0, act: 0, tot: 0 };
          var h = '';
          rows.forEach(function (r) {
            g.net += r.net_fare_yen || 0;
            g.deduct += r.deduct_yen || 0;
            g.trip += r.trip_count || 0;
            g.act += r.actual_total_m || 0;
            g.tot += r.total_distance_m || 0;
            h +=
              '<tr><td>' +
              esc(hi ? dayLabel(r.date) : r.label || r.device_id) +
              '</td><td>' +
              money(r.net_fare_yen) +
              '</td>' +
              (hi ? '' : '<td>' + money(r.deduct_yen || 0) + '</td>') +
              '<td>' +
              (r.trip_count || 0) +
              '</td><td>' +
              UriageAgg.km(r.actual_total_m) +
              '</td><td>' +
              UriageAgg.km(r.total_distance_m) +
              '</td></tr>';
          });
          h +=
            '<tr class="sum"><td>合計</td><td>' +
            money(g.net) +
            '</td>' +
            (hi ? '' : '<td>' + money(g.deduct) + '</td>') +
            '<td>' +
            g.trip +
            '</td><td>' +
            UriageAgg.km(g.act) +
            '</td><td>' +
            UriageAgg.km(g.tot) +
            '</td></tr>';
          $('kamiBody').innerHTML = h;
        }

        function rowHtml(o) {
          // バーは「一番多い所を100%」で見る（額の大小が一目で分かる）
          var pct = o.max > 0 ? Math.max(2, Math.round((o.value / o.max) * 100)) : 0;
          return (
            '<div class="row">' +
            '<div class="rhead"><div class="rname">' +
            o.name +
            '</div><div class="ramt">' +
            money(o.value) +
            '</div></div>' +
            '<div class="rbar"><span style="width:' +
            pct +
            '%"></span></div>' +
            '<div class="rsub">' +
            o.sub +
            '</div>' +
            '<button class="rmore" type="button" data-key="' +
            esc(o.key) +
            '">' +
            (o.open ? '閉じる ▴' : o.openText) +
            '</button>' +
            (o.open ? '<div class="rdetail">' + o.detail + '</div>' : '') +
            '</div>'
          );
        }

        function render() {
          $('monthLabel').textContent = ymLabel(MONTH);
          $('segCar').className = 'segb' + (MODE === 'car' ? ' on' : '');
          $('segDay').className = 'segb' + (MODE === 'day' ? ' on' : '');

          var list = $('list');
          var rows = MODE === 'day' ? DAYS : ROWS;
          if (!rows.length) {
            list.innerHTML = '';
            showMsg('この月はまだ記録がありません。');
            return;
          }
          showMsg('');

          var max = 0;
          rows.forEach(function (r) {
            if (r.net_fare_yen > max) max = r.net_fare_yen;
          });

          renderKami(rows);

          var html = '';
          rows.forEach(function (r) {
            if (MODE === 'day') {
              html += rowHtml({
                key: r.date,
                name: dayLabel(r.date),
                value: r.net_fare_yen,
                max: max,
                sub: subText(r),
                open: !!OPEN[r.date],
                openText: '車ごと ▾',
                detail: r.cars.map(carLine).join(''),
              });
            } else {
              html += rowHtml({
                key: r.device_id,
                name:
                  '<input class="carname" data-dev="' +
                  esc(r.device_id) +
                  '" value="' +
                  esc(r.label) +
                  '" placeholder="車の名前">',
                value: r.net_fare_yen,
                max: max,
                sub: subText(r),
                open: !!OPEN[r.device_id],
                openText: '日ごと ▾',
                detail: r.shifts.map(shiftLine).join(''),
              });
            }
          });

          var t = UriageAgg.total(rows);
          html +=
            '<div class="row totalrow">' +
            '<div class="rhead"><div class="rname">合計</div><div class="ramt">' +
            money(t.net_fare_yen) +
            '</div></div>' +
            '<div class="rsub">' +
            subText(t) +
            '</div>' +
            '</div>';

          list.innerHTML = html;
          wire();
        }

        function wire() {
          Array.prototype.forEach.call(document.querySelectorAll('.rmore'), function (b) {
            b.onclick = function () {
              var k = b.getAttribute('data-key');
              OPEN[k] = !OPEN[k];
              render();
            };
          });
          Array.prototype.forEach.call(document.querySelectorAll('.carname'), function (i) {
            i.onchange = function () {
              saveLabel(i.getAttribute('data-dev'), i.value);
            };
          });
          Array.prototype.forEach.call(document.querySelectorAll('.yen'), function (i) {
            i.onchange = function () {
              saveEdit(i.getAttribute('data-sid'), i.getAttribute('data-f'), i.value);
            };
          });
        }

        // ---------- 保存（手入力ぶん・元データは触らない） ----------
        function saveLabel(deviceId, label) {
          if (!COMPANY) return;
          DKSession.rest(SESS, 'dk_device_labels?on_conflict=company_id,device_id', {
            method: 'POST',
            headers: { Prefer: 'resolution=merge-duplicates' },
            body: JSON.stringify({
              company_id: COMPANY.company_id,
              device_id: deviceId,
              label: label,
              updated_at: new Date().toISOString(),
            }),
          })
            .then(function (r) {
              if (!r.ok) saveErr('車の名前を保存できませんでした。', r);
              else showErr('');
            })
            .catch(function () {
              showErr('車の名前を保存できませんでした。');
            });
        }

        function saveEdit(shiftId, field, value) {
          if (!COMPANY) return;
          var v = parseInt(value, 10);
          if (!isFinite(v) || v < 0) v = 0;
          var cur = (window.__editsById || {})[shiftId] || {};
          var body = {
            shift_id: shiftId,
            company_id: COMPANY.company_id,
            toll_yen: cur.toll_yen || 0,
            bridge_yen: cur.bridge_yen || 0,
            other_yen: cur.other_yen || 0,
            updated_at: new Date().toISOString(),
          };
          body[field] = v;

          DKSession.rest(SESS, 'dk_shift_edits?on_conflict=shift_id', {
            method: 'POST',
            headers: { Prefer: 'resolution=merge-duplicates' },
            body: JSON.stringify(body),
          })
            .then(function (r) {
              if (!r.ok) {
                showErr('保存できませんでした。通信を確認してください。');
                return;
              }
              showErr('');
              window.__editsById[shiftId] = body;
              recalc(); // 売上（差引後）と合計に即反映
              render();
            })
            .catch(function () {
              showErr('保存できませんでした。通信を確認してください。');
            });
        }
      })();
    </script>
    <!-- ★★事務所の 下の 帯（各ページへ 飛ぶ）★★ 2026-09-04（司さん）
         「この事務所だけ 他の アプリと 違う 型式なんを 同じに しろや」
         「フッター 作って 各ページに 飛ぶようにしろ」
         ★行き先は js/jimusho-footer.js の 1か所★（画面ごとに 手書きしない） -->
    <script src="js/jimusho-footer.js"></script>
  </body>
</html>
