<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ダイコメ 会社ダッシュボード</title>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>"
    />
    <style>
      :root {
        --blue: #007aff;
        --blue-d: #0a5fd0;
        --ink: #14243d;
        --muted: #5a6b82;
        --bg: #f2f7ff;
        --line: #dbe7f7;
        --danger: #e0483d;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 22px 18px 60px;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .logo {
        font-weight: 800;
        font-size: 20px;
        color: var(--blue-d);
      }

      .top .tag {
        font-size: 12px;
        font-weight: 700;
        color: #fff;
        background: var(--blue);
        border-radius: 999px;
        padding: 4px 12px;
      }

      .who {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 12.5px;
        color: var(--muted);
        margin: 2px 0 14px;
      }

      .who .mail {
        word-break: break-all;
      }

      .logout {
        flex: 0 0 auto;
        background: #fff;
        color: var(--blue-d);
        border: 1.5px solid var(--line);
        border-radius: 8px;
        padding: 5px 12px;
        font-size: 12.5px;
        font-weight: 700;
      }

      h1.co {
        font-size: 22px;
        margin: 6px 0 20px;
        word-break: break-all;
      }

      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px 18px;
        margin-bottom: 16px;
      }

      .card h2 {
        font-size: 15px;
        color: var(--blue-d);
        margin-bottom: 4px;
      }

      .card .desc {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 14px;
      }

      .url-box {
        background: var(--bg);
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 11px 12px;
        font-size: 13px;
        word-break: break-all;
        user-select: all;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        font-weight: 700;
      }

      .btn {
        background: var(--blue-d);
        color: #fff;
        padding: 9px 16px;
        font-size: 13px;
      }

      .btn.ghost {
        background: #fff;
        color: var(--blue-d);
        border: 1.5px solid var(--blue);
      }

      #qr {
        margin: 14px auto 0;
        width: 170px;
      }

      #qr svg,
      #qr img {
        width: 170px;
        height: 170px;
      }

      /* seat bar */
      .seat-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .seat-num {
        font-size: 15px;
        font-weight: 800;
      }

      .seat-num b {
        font-size: 26px;
        color: var(--blue);
      }

      .bar {
        height: 12px;
        border-radius: 999px;
        background: #e3ecfb;
        overflow: hidden;
      }

      .bar > span {
        display: block;
        height: 100%;
        background: var(--blue);
        border-radius: 999px;
        transition: width 0.3s;
      }

      /* device list */
      .dev {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }

      .dev:first-of-type {
        border-top: none;
      }

      .dev .id {
        font-family: monospace;
        font-size: 13px;
        word-break: break-all;
      }

      .dev .sub {
        font-size: 12px;
        color: var(--muted);
      }

      .dev .rm {
        background: #fff;
        color: var(--danger);
        border: 1.5px solid var(--danger);
        padding: 7px 14px;
        font-size: 13px;
        flex: 0 0 auto;
      }

      .empty {
        color: var(--muted);
        font-size: 14px;
        text-align: center;
        padding: 12px 0;
      }

      .status-off {
        background: #fdecea;
        color: var(--danger);
        border: 1px solid #f5c6c2;
        border-radius: 10px;
        padding: 12px;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 16px;
        text-align: center;
      }

      /* register form (会社がまだ無い時) */
      #register {
        display: none;
      }

      #register .lead {
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      #register label {
        display: block;
        font-weight: 700;
        font-size: 14px;
        margin: 16px 0 6px;
      }

      #register .hint {
        font-weight: 400;
        color: var(--muted);
        font-size: 12.5px;
      }

      #register input {
        width: 100%;
        padding: 13px 14px;
        font-size: 16px;
        border: 1.5px solid #cddcf2;
        border-radius: 10px;
        font-family: inherit;
      }

      #register input:focus {
        outline: none;
        border-color: var(--blue);
      }

      .submit {
        width: 100%;
        margin-top: 22px;
        padding: 15px;
        background: var(--blue);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        font-family: inherit;
      }

      .submit:disabled {
        opacity: 0.6;
      }

      .err {
        color: var(--danger);
        font-weight: 700;
        font-size: 13.5px;
        margin-top: 12px;
        display: none;
      }

      #loading {
        text-align: center;
        color: var(--muted);
        padding: 60px 0;
        font-size: 15px;
      }

      .foot {
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="logo">🚗 ダイコメ</div>
        <div class="tag">会社ダッシュボード</div>
      </div>
      <div class="who" id="who" style="display: none">
        <span class="mail" id="whoMail"></span>
        <button class="logout" id="logout" type="button">ログアウト</button>
      </div>

      <div id="loading">読み込み中…</div>

      <!-- 会社がまだ無い時: 登録フォーム -->
      <div id="register" class="card">
        <h2 style="font-size: 18px; color: var(--ink)">はじめに、会社を登録</h2>
        <p class="lead">登録すると、ドライバーに配る専用URL／QRがこの画面に出ます。</p>
        <label>会社名<input id="fName" maxlength="100" placeholder="例）〇〇運転代行" /></label>
        <label
          >連絡先 <span class="hint">（任意・メール／電話）</span>
          <input id="fContact" maxlength="200" placeholder="例）090-0000-0000" />
        </label>
        <label
          >使う台数 <span class="hint">（随伴車の台数）</span>
          <input id="fSeat" type="number" min="1" max="50" value="1" />
        </label>
        <button class="submit" id="regBtn" type="button">この内容で登録する</button>
        <div class="err" id="regErr"></div>
      </div>

      <!-- 会社がある時: ダッシュボード -->
      <div id="main" style="display: none">
        <h1 class="co" id="coName">—</h1>
        <div class="status-off" id="statusOff" style="display: none">
          ⚠ 現在ご利用が停止されています。事務所（ダイコメ）にご確認ください。
        </div>

        <!-- 配布用URL/QR -->
        <div class="card">
          <h2>ドライバーに配るURL／QR</h2>
          <div class="desc">
            随伴車のスマホでこのURL（またはQR）を開くと、その端末が使えるようになります。
          </div>
          <div class="url-box" id="coUrl">—</div>
          <div class="row">
            <button class="btn" id="copyUrl" type="button">URLをコピー</button>
            <button class="btn ghost" id="toggleQr" type="button">QRを表示</button>
          </div>
          <div id="qr" style="display: none"></div>
        </div>

        <!-- 台数 -->
        <div class="card">
          <div class="seat-head">
            <h2 style="margin: 0">使用台数</h2>
            <div class="seat-num"><b id="seatUsed">0</b> / <span id="seatMax">0</span> 台</div>
          </div>
          <div class="bar"><span id="seatBar" style="width: 0%"></span></div>
          <div class="desc" style="margin: 10px 0 0">
            契約台数まで有効化できます。どの車でも使えます。空きが無い時は、下で使っていない端末を外してください。
          </div>
        </div>

        <!-- 端末一覧 -->
        <div class="card">
          <h2>有効化した端末</h2>
          <div class="desc">機種変・入れ替えの時は「外す」で席を空けられます。</div>
          <div id="devList"></div>
        </div>
      </div>

      <div class="foot" id="foot" style="display: none">
        ログインした人だけがこの画面を開けます。
      </div>
    </div>

    <script src="js/qrcode.min.js"></script>
    <script>
      (function () {
        'use strict';
        var SB_URL = 'https://tnfwipbgfgjaymlszeid.supabase.co';
        var REST = SB_URL + '/rest/v1';
        var FN_REGISTER = SB_URL + '/functions/v1/dk-register-company';
        var ANON =
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZndpcGJnZmdqYXltbHN6ZWlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Nzk4MzQsImV4cCI6MjA5NzE1NTgzNH0.zhKPLSlW4zxsdjsXNvqDHvtP3wBqp-EKaxbjqLGW_ek';
        var SESS_KEY = 'dk_dash_sess';

        var SESS = null;
        var COMPANY = null;
        var currentUrl = '';

        var $ = function (id) {
          return document.getElementById(id);
        };
        function show(id, on) {
          $(id).style.display = on ? '' : 'none';
        }
        function goLogin() {
          location.replace('login.html');
        }

        // ---------- セッション ----------
        function parseHash() {
          var h = (location.hash || '').replace(/^#/, '');
          if (!h) return null;
          var p = new URLSearchParams(h);
          var at = p.get('access_token');
          if (!at) return null;
          var now = Math.floor(Date.now() / 1000);
          var exp = parseInt(p.get('expires_at') || '0', 10);
          if (!exp) exp = now + (parseInt(p.get('expires_in') || '3600', 10) || 3600);
          return {
            access_token: at,
            refresh_token: p.get('refresh_token') || '',
            expires_at: exp,
          };
        }
        function saveSess(s) {
          SESS = s;
          try {
            localStorage.setItem(SESS_KEY, JSON.stringify(s));
          } catch (e) {}
        }
        function loadSess() {
          try {
            return JSON.parse(localStorage.getItem(SESS_KEY) || 'null');
          } catch (e) {
            return null;
          }
        }
        function clearSess() {
          SESS = null;
          try {
            localStorage.removeItem(SESS_KEY);
          } catch (e) {}
        }
        function refreshSess(s) {
          if (!s.refresh_token) return Promise.resolve(null);
          return fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
            method: 'POST',
            headers: { apikey: ANON, 'Content-Type': 'application/json' },
            body: JSON.stringify({ refresh_token: s.refresh_token }),
          })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (j) {
              if (!j || !j.access_token) return null;
              var now = Math.floor(Date.now() / 1000);
              var ns = {
                access_token: j.access_token,
                refresh_token: j.refresh_token || s.refresh_token,
                expires_at: j.expires_at || now + (j.expires_in || 3600),
              };
              saveSess(ns);
              return ns;
            })
            .catch(function () {
              return null;
            });
        }

        // ---------- REST ----------
        function api(path, opts) {
          opts = opts || {};
          var h = {
            apikey: ANON,
            Authorization: 'Bearer ' + SESS.access_token,
            'Content-Type': 'application/json',
          };
          if (opts.headers) for (var k in opts.headers) h[k] = opts.headers[k];
          opts.headers = h;
          return fetch(REST + path, opts);
        }

        function getUser() {
          return fetch(SB_URL + '/auth/v1/user', {
            headers: { apikey: ANON, Authorization: 'Bearer ' + SESS.access_token },
          }).then(function (r) {
            return r.ok ? r.json() : null;
          });
        }

        // ---------- 画面 ----------
        function fmtDate(s) {
          if (!s) return '未使用';
          try {
            var d = new Date(s);
            return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
          } catch (e) {
            return '';
          }
        }

        function loadDevices() {
          return api(
            '/dk_company_devices?select=device_id,vin,last_seen&company_id=eq.' +
              encodeURIComponent(COMPANY.company_id) +
              '&order=last_seen.desc.nullslast'
          )
            .then(function (r) {
              return r.ok ? r.json() : [];
            })
            .catch(function () {
              return [];
            });
        }

        function renderDashboard() {
          show('loading', false);
          show('register', false);
          show('main', true);
          $('coName').textContent = COMPANY.name || '(会社名なし)';
          show('statusOff', COMPANY.status === 'off');
          currentUrl = location.origin + '/?c=' + COMPANY.url_token;
          $('coUrl').textContent = currentUrl;

          loadDevices().then(function (devs) {
            devs = Array.isArray(devs) ? devs : [];
            var used = devs.length;
            var max = COMPANY.seat_limit || 0;
            $('seatUsed').textContent = used;
            $('seatMax').textContent = max;
            $('seatBar').style.width =
              (max ? Math.min(100, Math.round((used / max) * 100)) : 0) + '%';

            var list = $('devList');
            list.innerHTML = '';
            if (!devs.length) {
              list.innerHTML = '<div class="empty">まだ端末はありません</div>';
              return;
            }
            devs.forEach(function (d) {
              var wrap = document.createElement('div');
              wrap.className = 'dev';
              var left = document.createElement('div');
              var idShort = (d.device_id || '').slice(0, 8) + '…';
              left.innerHTML =
                '<div class="id"></div><div class="sub">最終利用 ' +
                fmtDate(d.last_seen) +
                '</div>';
              left.querySelector('.id').textContent = idShort;
              var btn = document.createElement('button');
              btn.className = 'rm';
              btn.textContent = '外す';
              btn.onclick = function () {
                if (!confirm('この端末を外しますか？（席が1つ空きます）')) return;
                btn.disabled = true;
                btn.textContent = '外し中…';
                api(
                  '/dk_company_devices?company_id=eq.' +
                    encodeURIComponent(COMPANY.company_id) +
                    '&device_id=eq.' +
                    encodeURIComponent(d.device_id),
                  { method: 'DELETE', headers: { Prefer: 'return=minimal' } }
                )
                  .then(function (r) {
                    if (r.ok) renderDashboard();
                    else {
                      btn.disabled = false;
                      btn.textContent = '外す';
                      alert('外せませんでした');
                    }
                  })
                  .catch(function () {
                    btn.disabled = false;
                    btn.textContent = '外す';
                    alert('ネットに繋がる所で、もう一度お試しください。');
                  });
              };
              wrap.appendChild(left);
              wrap.appendChild(btn);
              list.appendChild(wrap);
            });
          });
        }

        function showRegister() {
          show('loading', false);
          show('main', false);
          show('register', true);
        }

        function loadCompany() {
          return api('/dk_companies?select=company_id,name,url_token,seat_limit,status')
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (cos) {
              if (!Array.isArray(cos)) return goLogin();
              if (cos.length === 0) {
                showRegister();
              } else {
                COMPANY = cos[0];
                renderDashboard();
              }
            })
            .catch(function () {
              show('loading', false);
              $('loading').style.display = 'block';
              $('loading').textContent = 'ネットに繋がる所で開いてください。';
            });
        }

        // ---------- ボタン ----------
        function bindStaticButtons() {
          $('logout').addEventListener('click', function () {
            clearSess();
            goLogin();
          });

          $('copyUrl').addEventListener('click', function () {
            var b = $('copyUrl');
            function done() {
              b.textContent = 'コピーしました';
              setTimeout(function () {
                b.textContent = 'URLをコピー';
              }, 1600);
            }
            if (navigator.clipboard && navigator.clipboard.writeText)
              navigator.clipboard.writeText(currentUrl).then(done, done);
            else done();
          });

          $('toggleQr').addEventListener('click', function () {
            var el = $('qr');
            var b = $('toggleQr');
            if (el.style.display === 'none') {
              try {
                var qr = window.qrcode(0, 'M');
                qr.addData(currentUrl);
                qr.make();
                el.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2 });
              } catch (e) {
                el.innerHTML = '';
              }
              el.style.display = 'block';
              b.textContent = 'QRを隠す';
            } else {
              el.style.display = 'none';
              b.textContent = 'QRを表示';
            }
          });

          $('regBtn').addEventListener('click', function () {
            var errEl = $('regErr');
            errEl.style.display = 'none';
            var name = $('fName').value.trim();
            var contact = $('fContact').value.trim();
            var seat = parseInt($('fSeat').value, 10) || 1;
            if (!name) {
              errEl.textContent = '会社名を入れてください';
              errEl.style.display = 'block';
              return;
            }
            var b = $('regBtn');
            b.disabled = true;
            b.textContent = '登録中…';
            fetch(FN_REGISTER, {
              method: 'POST',
              headers: {
                apikey: ANON,
                Authorization: 'Bearer ' + SESS.access_token,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ company_name: name, contact: contact, seat_limit: seat }),
            })
              .then(function (r) {
                return r.json();
              })
              .then(function (j) {
                b.disabled = false;
                b.textContent = 'この内容で登録する';
                if (j && j.ok) {
                  show('register', false);
                  show('loading', true);
                  loadCompany();
                } else {
                  errEl.textContent =
                    j && j.reason === 'unauthorized'
                      ? 'ログインの有効期限が切れました。もう一度ログインしてください。'
                      : '登録できませんでした。少し時間をおいて、もう一度お試しください。';
                  errEl.style.display = 'block';
                }
              })
              .catch(function () {
                b.disabled = false;
                b.textContent = 'この内容で登録する';
                errEl.textContent = 'ネットに繋がる所で、もう一度お試しください。';
                errEl.style.display = 'block';
              });
          });
        }

        // ---------- 起動 ----------
        function start() {
          bindStaticButtons();
          var s = parseHash();
          if (s) {
            saveSess(s);
            try {
              history.replaceState(null, '', location.pathname + location.search);
            } catch (e) {}
          } else {
            s = loadSess();
          }
          if (!s || !s.access_token) return goLogin();

          var now = Math.floor(Date.now() / 1000);
          var ready;
          if (s.expires_at && s.expires_at <= now + 10) {
            ready = refreshSess(s);
          } else {
            SESS = s;
            ready = Promise.resolve(s);
          }
          ready.then(function (valid) {
            if (!valid) return goLogin();
            SESS = valid;
            getUser().then(function (u) {
              if (!u || !u.id) return goLogin();
              $('whoMail').textContent = u.email || '';
              show('who', true);
              show('foot', true);
              loadCompany();
            });
          });
        }

        start();
      })();
    </script>
  </body>
</html>
