# Qodo PR-Agent OSS 設定 (2026-05-17 新規・Stage 1)
# 別途 .github/workflows/pr-agent.yml で GitHub Actions として起動する。
# https://github.com/qodo-ai/pr-agent

[config]
# ★設計変更宣言 (2026-05-18・⑬ 配線時): model ID を最新 Claude 4 系に更新
# 旧: claude-3-5-haiku-latest / claude-3-5-sonnet-latest
# 新: Haiku 4.5 (= cost-effective primary) + Sonnet 4.5 fallback
model = "anthropic/claude-haiku-4-5-20251001"
fallback_models = ["anthropic/claude-sonnet-4-5-20250929"]

[github_action_config]
auto_review = true
auto_describe = true
auto_improve = false

[pr_reviewer]
require_score_review = false
require_tests_review = true
require_security_review = true
require_focused_review = true
num_code_suggestions = 4
extra_instructions = """
ダイコメ絶対ルール (違反は冒頭に alert):
- state.distance_m は課金根拠・GPS 直線距離での課金禁止
- 距離加算 5 経路 (L393/L462/L824/L842/L1172) 以外の書込は alert
- ★絶対ルール適用外区間コメントが sanitizer marker
- console.error は本番出力前提・dlog 置換禁止
- iOS/Android 両 OS 経路の確認漏れは alert
- 設計変更は ★設計変更宣言 として明示が必要
"""

[pr_description]
publish_labels = true
add_original_user_description = true
keep_original_user_title = true
extra_instructions = "日本語で簡潔に・絶対ルール違反は冒頭に alert"

[pr_code_suggestions]
num_code_suggestions = 4
extra_instructions = "ダイコメ絶対ルール準拠を最優先・パフォーマンスより正確性"

[pr_questions]
enable_auto_questions = false

[ignore]
glob = [
    "data/**",
    "coverage/**",
    "node_modules/**",
    ".tmp/**",
    "tmp/**",
    "outputs/**",
    "download/**",
    "test-results/**",
    "input/**",
]
