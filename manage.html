<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ダイコメ 会社管理ページ</title>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>"
    />
    <style>
      :root {
        --blue: #007aff;
        --blue-d: #0a5fd0;
        --ink: #14243d;
        --muted: #5a6b82;
        --bg: #f2f7ff;
        --line: #dbe7f7;
        --danger: #e0483d;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 22px 18px 60px;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .logo {
        font-weight: 800;
        font-size: 20px;
        color: var(--blue-d);
      }

      .top .tag {
        font-size: 12px;
        font-weight: 700;
        color: #fff;
        background: var(--blue);
        border-radius: 999px;
        padding: 4px 12px;
      }

      h1.co {
        font-size: 22px;
        margin: 10px 0 20px;
        word-break: break-all;
      }

      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px 18px;
        margin-bottom: 16px;
      }

      .card h2 {
        font-size: 15px;
        color: var(--blue-d);
        margin-bottom: 4px;
      }

      .card .desc {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 14px;
      }

      .url-box {
        background: var(--bg);
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 11px 12px;
        font-size: 13px;
        word-break: break-all;
        user-select: all;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        font-weight: 700;
      }

      .btn {
        background: var(--blue-d);
        color: #fff;
        padding: 9px 16px;
        font-size: 13px;
      }

      .btn.ghost {
        background: #fff;
        color: var(--blue-d);
        border: 1.5px solid var(--blue);
      }

      #qr {
        margin: 14px auto 0;
        width: 170px;
      }

      #qr svg,
      #qr img {
        width: 170px;
        height: 170px;
      }

      /* seat bar */
      .seat-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .seat-num {
        font-size: 15px;
        font-weight: 800;
      }

      .seat-num b {
        font-size: 26px;
        color: var(--blue);
      }

      .bar {
        height: 12px;
        border-radius: 999px;
        background: #e3ecfb;
        overflow: hidden;
      }

      .bar > span {
        display: block;
        height: 100%;
        background: var(--blue);
        border-radius: 999px;
        transition: width 0.3s;
      }

      /* device list */
      .dev {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }

      .dev:first-of-type {
        border-top: none;
      }

      .dev .id {
        font-family: monospace;
        font-size: 13px;
        word-break: break-all;
      }

      .dev .sub {
        font-size: 12px;
        color: var(--muted);
      }

      .dev .rm {
        background: #fff;
        color: var(--danger);
        border: 1.5px solid var(--danger);
        padding: 7px 14px;
        font-size: 13px;
        flex: 0 0 auto;
      }

      .empty {
        color: var(--muted);
        font-size: 14px;
        text-align: center;
        padding: 12px 0;
      }

      .status-off {
        background: #fdecea;
        color: var(--danger);
        border: 1px solid #f5c6c2;
        border-radius: 10px;
        padding: 12px;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 16px;
        text-align: center;
      }

      #loading,
      #err {
        text-align: center;
        color: var(--muted);
        padding: 40px 0;
        font-size: 15px;
      }

      #err {
        color: var(--danger);
        font-weight: 700;
      }

      .foot {
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <div class="logo">🚗 ダイコメ</div>
        <div class="tag">会社 管理ページ</div>
      </div>

      <div id="loading">読み込み中…</div>
      <div id="err" style="display: none"></div>

      <div id="main" style="display: none">
        <h1 class="co" id="coName">—</h1>
        <div class="status-off" id="statusOff" style="display: none">
          ⚠ 現在ご利用が停止されています。事務所にご確認ください。
        </div>

        <!-- 配布用URL/QR -->
        <div class="card">
          <h2>ドライバーに配るURL／QR</h2>
          <div class="desc">
            随伴車のスマホでこのURL（またはQR）を開くと、その端末が使えるようになります。
          </div>
          <div class="url-box" id="coUrl">—</div>
          <div class="row">
            <button class="btn" id="copyUrl" type="button">URLをコピー</button>
            <button class="btn ghost" id="toggleQr" type="button">QRを表示</button>
          </div>
          <div id="qr" style="display: none"></div>
        </div>

        <!-- 台数 -->
        <div class="card">
          <div class="seat-head">
            <h2 style="margin: 0">使用台数</h2>
            <div class="seat-num"><b id="seatUsed">0</b> / <span id="seatMax">0</span> 台</div>
          </div>
          <div class="bar"><span id="seatBar" style="width: 0%"></span></div>
          <div class="desc" style="margin: 10px 0 0">
            契約台数まで有効化できます。どの車でも使えます。空きが無い時は、下で使っていない端末を外してください。
          </div>
        </div>

        <!-- 端末一覧 -->
        <div class="card">
          <h2>有効化した端末</h2>
          <div class="desc">機種変・入れ替えの時は「外す」で席を空けられます。</div>
          <div id="devList"></div>
        </div>
      </div>

      <div class="foot">
        この管理ページのURLは大切に保管してください（他人に渡さないでください）。
      </div>
    </div>

    <script src="js/qrcode.min.js"></script>
    <script>
      (function () {
        'use strict';
        var FN = 'https://tnfwipbgfgjaymlszeid.supabase.co/functions/v1/dk-company-manage';
        var ANON =
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZndpcGJnZmdqYXltbHN6ZWlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Nzk4MzQsImV4cCI6MjA5NzE1NTgzNH0.zhKPLSlW4zxsdjsXNvqDHvtP3wBqp-EKaxbjqLGW_ek';
        var K = new URLSearchParams(location.search).get('k') || '';
        var loading = document.getElementById('loading');
        var errEl = document.getElementById('err');
        var main = document.getElementById('main');
        var currentUrl = '';

        function call(action, deviceId) {
          return fetch(FN, {
            method: 'POST',
            headers: {
              apikey: ANON,
              Authorization: 'Bearer ' + ANON,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ admin_token: K, action: action, device_id: deviceId }),
          }).then(function (r) {
            return r.json();
          });
        }

        function fmtDate(s) {
          if (!s) return '未使用';
          try {
            var d = new Date(s);
            return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
          } catch (e) {
            return '';
          }
        }

        function render(info) {
          document.getElementById('coName').textContent = info.name || '(会社名なし)';
          document.getElementById('statusOff').style.display =
            info.status === 'off' ? 'block' : 'none';
          currentUrl = info.company_url || '';
          document.getElementById('coUrl').textContent = currentUrl;
          var devs = info.devices || [];
          var used = devs.length;
          var max = info.seat_limit || 0;
          document.getElementById('seatUsed').textContent = used;
          document.getElementById('seatMax').textContent = max;
          document.getElementById('seatBar').style.width =
            (max ? Math.min(100, Math.round((used / max) * 100)) : 0) + '%';

          var list = document.getElementById('devList');
          list.innerHTML = '';
          if (!devs.length) {
            list.innerHTML = '<div class="empty">まだ端末はありません</div>';
          } else {
            devs.forEach(function (d) {
              var wrap = document.createElement('div');
              wrap.className = 'dev';
              var left = document.createElement('div');
              var idShort = (d.device_id || '').slice(0, 8) + '…';
              left.innerHTML =
                '<div class="id">' +
                idShort +
                '</div><div class="sub">最終利用 ' +
                fmtDate(d.last_seen) +
                '</div>';
              var btn = document.createElement('button');
              btn.className = 'rm';
              btn.textContent = '外す';
              btn.onclick = function () {
                if (!confirm('この端末を外しますか？（席が1つ空きます）')) return;
                btn.disabled = true;
                btn.textContent = '外し中…';
                call('remove', d.device_id).then(function (r) {
                  if (r && r.ok) render(r);
                  else {
                    btn.disabled = false;
                    btn.textContent = '外す';
                    alert('外せませんでした');
                  }
                });
              };
              wrap.appendChild(left);
              wrap.appendChild(btn);
              list.appendChild(wrap);
            });
          }
          loading.style.display = 'none';
          main.style.display = 'block';
        }

        function showErr(msg) {
          loading.style.display = 'none';
          errEl.style.display = 'block';
          errEl.textContent = msg;
        }

        document.getElementById('copyUrl').addEventListener('click', function () {
          var b = document.getElementById('copyUrl');
          function done() {
            b.textContent = 'コピーしました';
            setTimeout(function () {
              b.textContent = 'URLをコピー';
            }, 1600);
          }
          if (navigator.clipboard && navigator.clipboard.writeText)
            navigator.clipboard.writeText(currentUrl).then(done, done);
          else done();
        });

        document.getElementById('toggleQr').addEventListener('click', function () {
          var el = document.getElementById('qr');
          var b = document.getElementById('toggleQr');
          if (el.style.display === 'none') {
            try {
              var qr = window.qrcode(0, 'M');
              qr.addData(currentUrl);
              qr.make();
              el.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2 });
            } catch (e) {
              el.innerHTML = '';
            }
            el.style.display = 'block';
            b.textContent = 'QRを隠す';
          } else {
            el.style.display = 'none';
            b.textContent = 'QRを表示';
          }
        });

        if (!K) {
          showErr('管理用リンクが正しくありません（?k= が必要です）');
          return;
        }
        call('info')
          .then(function (r) {
            if (r && r.ok) render(r);
            else showErr('この管理ページを開けませんでした。リンクをご確認ください。');
          })
          .catch(function () {
            showErr('ネットに繋がる所で開いてください。');
          });
      })();
    </script>
  </body>
</html>
